repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
        # Preserve generated evidence bytes and their recorded hashes.
        exclude: '(^|.*/)artifacts/|^analyses/[^/]+/(figures|notebooks|source_tables|tables)/|^results/[^/]+/validation_logs/|(^|/)metrics\.json$|^experiments/[^/]+/[^/]*_compiler\.json$'
      - id: trailing-whitespace
        exclude: '(^|.*/)artifacts/|^analyses/[^/]+/(figures|notebooks|source_tables|tables)/|^results/[^/]+/validation_logs/|(^|/)metrics\.json$|^experiments/[^/]+/[^/]*_compiler\.json$'
      - id: check-added-large-files
        exclude: '^analyses/[^/]+/(figures|notebooks|source_tables|tables)/'
      - id: check-added-large-files
        name: Check analysis artifacts remain below 10 MiB
        files: '^analyses/[^/]+/(figures|notebooks|source_tables|tables)/'
        args: [--maxkb=10240]
  - repo: local
    hooks:
      - id: labproj-refresh
        name: Refresh lab project compliance state
        entry: labproj refresh --write --strict --fail-on error --fail-on-change
        language: system
        pass_filenames: false
      - id: labproj-check
        name: Check lab project provenance structure
        entry: labproj check --strict
        language: system
        pass_filenames: false
