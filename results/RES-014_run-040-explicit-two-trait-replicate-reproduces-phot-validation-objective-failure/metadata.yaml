summary: 'On PHOT_CHLRE_Chen_2023, the EXP-014 explicit two-trait validation-objective
  replicate reproduced the RUN-036 failure pattern almost exactly: single- and double-mutant
  holdout ranking remained weak, functional KS worsened, the fitted reference stayed
  near the peak, and empirical pairwise strength again sat at the top of its prior.
  This strengthens the evidence that the current PHOT explicit two-trait implementation
  is structurally mismatched rather than just noisy.'
