summary: 'On PHOT_CHLRE_Chen_2023, the EXP-015 flexible monotone stability/activity
  readout diagnostic improved held-out single- and double-mutant ranking relative
  to the explicit product/gate two-trait failure, and double-mutant ranking slightly
  exceeded the stability-targeted validation-objective control. It did not rescue
  epistasis prediction: epistasis Spearman was near zero and KS was poor. The result
  suggests the hard-coded product/gate readout contributed to ranking failure, but
  a flexible two-latent monotone surface is still not a sufficient HYP-007 rescue.'
