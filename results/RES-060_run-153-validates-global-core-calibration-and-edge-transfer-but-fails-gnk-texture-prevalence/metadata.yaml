summary: RUN-153 formally passed 6/9 required EXP-062 checks and issued CALIBRATED_SIGMOID_TRANSMISSION_FAILED.
  The globally frozen mutation-unit calibration passed all 60 held-out core cells
  and all 360 complete-h1 edge cells, and GNK-specific texture remained aligned and
  dose-directional. However, only 24/360 actual-core cells and 0/360 frozen-core cells
  met the preregistered texture practical-prevalence floor; exact per-landscape normalization
  did not rescue it. The recorded directionality failure is a floating-point equality
  artifact and becomes a pass under 1e-12 tolerance, changing the audit to 7/9 without
  changing the overall decision. This weakens the full observable protein-scale form
  of HYP-005 while preserving narrow calibration, edge, dose, and length-stability
  evidence.
