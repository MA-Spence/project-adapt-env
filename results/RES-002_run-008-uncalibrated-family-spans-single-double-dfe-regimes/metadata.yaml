summary: RUN-008 does not test empirical recovery directly, but it shows that the
  uncalibrated Adapt-Env family spans a broad envelope of one-step and two-step mutational
  regimes. Across the preregistered grid, singles were usually highly neutral, doubles
  were always more deleterious than singles and more lethal in most landscapes, stability
  margin dominated severity, and increasing epistasis strength increased double-mutant
  epistasis magnitude without changing single-mutant DFEs. This keeps HYP-001 scientifically
  live by arguing that the failure in RUN-006 is unlikely to be explained only by
  a complete lack of model-family capacity.
