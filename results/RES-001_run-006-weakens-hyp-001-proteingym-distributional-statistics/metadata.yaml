summary: RUN-006 produced a balanced eight-assay ProteinGym panel with real MMseqs
  alignments, but the best shared parameter regime collapsed epistasis, empirical
  pairwise structure, and noise to zero and showed weak holdout performance. The synthetic
  landscapes reproduced some quantiles and conservation trends in a subset of assays,
  but broadly under-represented beneficial tails and over-produced negative skew,
  so the evidence weakens rather than supports HYP-001.
