summary: RUN-115 completed EXP-044 and found zero operationally equivalent bounded
  trait-space current-model candidates against the best available RUN-098 full-ABC
  PHOT comparator. The minimal model patch improved the previous gross component-guardrail
  failures, with 12/12 candidates passing component guardrails, but all rows failed
  absolute and relative aggregate-distance equivalence. Observable epistasis moved
  closer than previous nested-min calibrated fits, while raw latent magnitude epistasis
  remained tens to hundreds of units and held-out accessibility/local-energy tradeoffs
  persisted.
