summary: RUN-110 shows surrogate-assisted and exact-descriptive-gated cheaper fitting
  match the RUN-098 full-ABC selected nested-family PHOT fits across all five families
  under same-family equivalence margins, while deterministic summary loss and local
  ABC initialized from cheap fits match four of five. No cheaper protocol reaches
  the best empirical-readout-residual diagnostic comparator, so the result supports
  cheaper fitted-family PHOT protocol use but not a general claim that fast fitting
  is equivalent to full ABC.
