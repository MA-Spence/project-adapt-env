summary: On matched KRAS abundance and DARPin K55 binding assays, the paired thermodynamic
  binding readout improves functional KS and epistasis-prediction Spearman relative
  to raw controls, but it degrades single- and double-mutant holdout ranking, worsens
  abundance agreement, and leaves the fitted reference essentially at the peak. The
  result therefore weakens the current HYP-007 implementation rather than supporting
  a clean multi-latent rescue.
