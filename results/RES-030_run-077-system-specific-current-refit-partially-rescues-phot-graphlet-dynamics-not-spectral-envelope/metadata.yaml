summary: RUN-077 fixes the RUN-073 pooling and stale-cache comparison problem by fitting
  PHOT and SPTN1 as independent current-model systems and emitting dense graphlet,
  Walsh, and GFT outputs. The PHOT current model is now the closest held-out candidate
  for the joint graphlet package and beats GNK and residual-only controls, so the
  strongest RES-028 evolutionary-dynamics failure is not reproduced under current
  system-specific refitting. However, PHOT still violates the preregistered spectral
  envelope, high-order signal is not removed by nonlinear readout correction, and
  the current model is only marginally better than smooth core. SPTN1 is a smooth
  2D negative control and cannot test high-order spectral claims. The result weakens
  the strong HYP-004 benchmark-adequacy claim while motivating HYP-008 local non-diffuse
  ruggedness.
