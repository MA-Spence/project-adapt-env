summary: RUN-055 supports two narrow HYP-004 expectations, adaptive-walk deceleration
  and declining beneficial fraction near higher-fitness backgrounds, but only 2/7
  preregistered validation tests passed. Mean beneficial effects did not decline near
  the peak, sign epistasis was absent, negative epistasis decreased rather than increased,
  and synthetic-alignment near-peak backgrounds exceeded the stored peak fitness.
  The run therefore weakens HYP-004 as stated while preserving a narrower adaptive-walk
  result.
