summary: 'RUN-069 corrects the RUN-067 calibration setting by scanning only fixed
  walk-initial residual/additive scale values. The fixed contact residual scale grid
  is directional: higher scale monotonically increases held-out SE, RSE, local maxima,
  WHT/GFT high-order fraction, residual high-order exposure, and lowers random-walk
  lag-1 autocorrelation. However, the result still does not validate a clean peak-proximal
  or late-walk unmasking mechanism, because stage-wise SE/RSE and high-order spectra
  are not consistently late-dominated even though smooth beneficial-effect proxies
  decline along the walk. The run supports HYP-005 for the fixed residual-scale knob
  and weakens the stronger HYP-004 biological ruggedness claim.'
