summary: RUN-093 finds that empirical PHOT graphlets and the empirical readout residual
  show stronger local Dirichlet-energy concentration than fitted current/smooth-core
  controls, but the RUN-091 empirical-module ABC candidate and empirical calibration
  modules do not uniquely explain that localization. No-module, random-module, uncoupled,
  residual, and GNK controls are competitive or better on key localization metrics,
  so the result weakens the current empirical-module implementation of HYP-008 while
  preserving a narrower residual-localization diagnosis.
