summary: 'On PHOT_CHLRE_Chen_2023, the stability-targeted validation-objective Bayesian
  fit improves the full predictive package relative to the explicit two-trait validation-objective
  run: single-mutant holdout ranking remains strong, double-mutant holdout ranking
  and epistasis prediction improve sharply, KS stays low, and the fitted reference
  moves away from the peak. This indicates that the current PHOT multi-latent/readout
  implementations are still structurally mismatched, while a stability-targeted causal
  mapping fits the scalar activity assay much better.'
