summary: On PHOT_CHLRE_Chen_2023, the EXP-017 oracle additive latent score plus flexible
  monotone global-epistasis baseline did not beat the recent mechanistic PHOT controls
  on the full prespecified metric package. The oracle models had near-zero single-mutant
  holdout Spearman, strong double-mutant ranking near 0.80, and only modest epistasis
  Spearman near 0.24-0.25 with poor KS. This fails the preregistered condition for
  blaming restrictive AdaptEnv latent priors alone and instead points back toward
  scalar-assay measurement limits, insufficient identifiability, or missing stability-specific/epistatic
  structure.
