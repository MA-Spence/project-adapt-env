summary: On PHOT_CHLRE_Chen_2023, the EXP-016 stability-first residual-trait diagnostic
  improved double-mutant holdout ranking after fitting an additional photophysical
  residual trait, but it slightly reduced single-mutant ranking and did not rescue
  epistasis prediction. The sparse pair-residual layer learned 133 residual effects
  yet produced the same held-out metrics as the residual-trait model, so the run does
  not support sparse residual epistasis as the missing PHOT structure. The result
  weakens HYP-007 as a complete empirical recovery claim while preserving residual
  readout structure as a narrower contributor to the mismatch.
