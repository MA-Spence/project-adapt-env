summary: RUN-142 ran the full preregistered EXP-058 A/B/C readout-coupling sweep (5022
  parameter sets, 10 templates). All three fixes fail all three gates (0/5022 core-guardrail,
  0/5022 GNK-separation, 20.4 percent monotonicity with wrong-direction medians); the
  terminal preregistered decision fires and Stage 4C/4D/4E reruns stay blocked. The
  binding failure is that no high-fitness plateau forms in the re-centred margin regime,
  so specific-epistasis transmission (achieved cleanly by Fix B mixed routing) and
  diminishing-returns plateau structure are not obtained together.
