summary: RUN-019 completed the resumed Bayesian SMC-ABC calibration and no longer
  collapsed the shared fit to zero epistasis, while preregistered synthetic-truth
  recovery succeeded on the same panel scaffold. Empirical holdout recovery on the
  six-assay ProteinGym stability panel nevertheless remained weak relative to the
  scientific claim, so the result still weakens HYP-001.
