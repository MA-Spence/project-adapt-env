summary: RUN-024 switched the SPTN1_CHICK single-assay Bayesian calibration to a stability-targeted
  synthetic readout and materially improved holdout ranking, epistasis prediction,
  and KS relative to RUN-022 while keeping the fitted reference far from the peak.
  Because the run still targets one assay rather than a shared multi-assay regime,
  it does not directly support HYP-001, but it does motivate the hypothesis by showing
  that readout-stage misspecification was a major contributor to the earlier failure.
