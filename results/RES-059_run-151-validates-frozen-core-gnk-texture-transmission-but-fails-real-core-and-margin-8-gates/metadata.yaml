summary: RUN-151 completed the full EXP-061 assay and passed all 12 technical checks
  but only 13/16 required checks overall, issuing SIGMOID_TRANSFER_FAILED. Pointwise
  scalar transfer and frozen-core candidate texture pass; common-threshold real-core
  edge coverage, actual-core texture, and margin-8 deployment fail. The sigmoid can
  carry normalized GNK texture, but real additive-core motion leaves almost all tested
  mutations outside the dynamic window and actual-core square texture below practical
  resolution. This weakens HYP-005 at the observable protein-scale boundary without
  testing the current public generator end to end.
