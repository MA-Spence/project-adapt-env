summary: RUN-112 completed EXP-043 and found zero operationally equivalent calibrated
  cheap-fitting rows. Positive affine observable calibration reduced visible epistasis
  scale for selected candidates but did not match empirical epistasis amplitude, left
  raw latent magnitude epistasis tens to hundreds of units too large, and failed component
  guardrails dominated by signed pairwise epistasis and accessibility/local-summary
  mismatch. The protocol is therefore not an equivalent replacement for full ABC or
  a validated scale-up path for GB1/TrpB.
