summary: 'RUN-057 passes 7/9 validation checks: TEM-1 homologue starts farther from
  the MMSeqs consensus have lower fitness, higher beneficial availability, larger
  adaptive-walk gains, decelerating greedy walks, and slightly lower random-walk autocorrelation;
  epistasis strength also increases absolute epistasis and random-step variance. The
  two failures are both stability-margin knob checks, and identical-start diagnostics
  show that nominal stability_margin values from 4 to 12 did not change realized background
  fitness or stability_margin_used, so the result supports the HYP-004 consensus-axis
  walk behaviour while weakening HYP-005 for the current stability-margin parameterization.'
