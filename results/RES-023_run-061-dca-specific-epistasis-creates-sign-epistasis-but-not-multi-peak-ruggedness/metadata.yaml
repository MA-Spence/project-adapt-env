summary: RUN-061 shows that disabling the old generic epistasis and adding DCA-prior
  state-specific pair terms creates strong selected pair epistasis and systematic
  one-sided sign epistasis in a dense TEM-1 local Hamming cube, with lower random-walk
  autocorrelation than prior smooth TEM-1 random-walk diagnostics. It does not yet
  produce reciprocal sign epistasis, multiple local maxima, accessible improving paths
  from the selected anchor to the all-alternative genotype, or a second-order-dominated
  rugged topology.
