summary: RUN-010 used a homogeneous multi-mutant ProteinGym stability panel, raw assay
  scores, assay-specific MAVE-NN observation models, and real MMseqs alignments, but
  the shared Adapt-Env calibration still showed weak single- and double-mutant holdout
  recovery. The measurement-layer confound was reduced, yet the downstream landscape
  fit remained poor, so the evidence further weakens rather than supports HYP-001.
