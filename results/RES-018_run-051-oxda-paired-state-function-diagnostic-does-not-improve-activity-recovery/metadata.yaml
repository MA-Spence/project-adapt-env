summary: On matched OXDA_RHOTO expression and activity single-mutant assays, the paired
  state/function branches did not improve activity holdout recovery over the function-only
  branch and left the fitted reference effectively at the peak. The result weakens
  the current HYP-007 implementation for this OXDA diagnostic without directly updating
  HYP-001.
