summary: 'RUN-073 confirms that the PHOT and Tsuboyama ABC refit used current epistasis/stability
  definitions and that synthetic truth recovery works under matched current-model
  semantics. However, the empirical posterior remains broad and plateau-like, and
  the joint two-assay fit trades off assay-specific structure: aggregate double-mutant
  ranking is reasonable, but empirical epistasis prediction remains weak relative
  to stronger prior assay-specific fits. This resolves the stale-cache procedural
  concern for this refit but does not validate a shared empirical calibration or graphlet
  ruggedness hypothesis.'
