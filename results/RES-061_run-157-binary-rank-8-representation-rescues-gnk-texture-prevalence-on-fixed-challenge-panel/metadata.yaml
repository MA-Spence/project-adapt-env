summary: RUN-157 reproduced the incumbent binary-rank-1 prevalence failure and issued
  the preregistered BINARY_RANK8_SUFFICIENT decision. At nearly unchanged median texture
  RMS, binary rank 8 raised median practical texture prevalence from 0.198 to 0.461
  and passed all 360/360 paired cells, with protein-level median gain 0.262 and bootstrap
  lower bound 0.248. Dense q20 coding alone worsened prevalence, and dense q20 rank
  8 remained below the per-length package gate. This narrowly supports an experiment-local,
  dose-directional GNK knob on the reused challenge panel; it is not independent protein
  generalization or public-model validation, and the Stage 4C/4D/4E hard stop remains.
