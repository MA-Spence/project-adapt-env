summary: 'RUN-089 shows that the RUN-079 no-module PHOT graphlet-distance improvement
  is stable across replicated held-out graphlet splits against fitted-current and
  smooth-core controls, but the result fails specificity controls: the uncoupled-module
  control is better overall and random/shuffled/empirical module families also improve
  against current. This weakens the current local non-diffuse HYP-008 mechanism while
  preserving a narrow capacity result.'
