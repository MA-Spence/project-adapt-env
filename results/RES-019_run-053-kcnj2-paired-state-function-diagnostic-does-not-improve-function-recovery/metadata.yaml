summary: On matched KCNJ2_MOUSE surface trafficking and ion-conduction single-mutant
  assays, paired state/function branches did not improve function holdout recovery
  over the function-only branch and left the reference near the peak. The result weakens
  the current HYP-007 implementation for this KCNJ2 diagnostic, with the caveat that
  the function observation layer itself was weak, and does not directly update HYP-001.
