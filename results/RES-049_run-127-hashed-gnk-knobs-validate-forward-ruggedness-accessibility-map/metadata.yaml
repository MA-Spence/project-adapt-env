summary: 'RUN-127 supports the EXP-051 WS-B knob-map claim: on enumerable L=8 coordinates,
  hashed GNK epistasis weight moved all preregistered ruggedness, spectrum, accessibility,
  sign-epistasis, and autocorrelation metrics in the expected directions, while the
  retained core/readout guardrail preserved plateaus and declining beneficial fraction
  at epi_weight=0. The result is a forward-generator validation, not empirical PHOT
  overlap or optimizer evidence.'
