summary: RUN-091 shows that ABC fitting of the coupled-family controls improves PHOT
  held-out graphlet distance for the empirical-module family relative to fitted current,
  smooth core, no-module, and shuffled-module controls, but it fails specificity because
  random-module is effectively tied and the uncoupled-module control is better; selected
  empirical-module energy remains diffuse. This weakens the current local non-diffuse
  HYP-008 mechanism while preserving only a narrow ABC capacity result.
