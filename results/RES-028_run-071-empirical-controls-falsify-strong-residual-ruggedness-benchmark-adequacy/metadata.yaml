summary: RUN-071 rejects smooth-core-only and global-readout-only explanations and
  confirms that fixed residual scale is directional across the synthetic graphlet
  grid, but the primary empirical PHOT graphlets violate the preregistered modest
  high-order-tail spectral envelope and no embedded procedural candidate matches empirical
  spectra, SE/RSE, local maxima, accessibility, and random-walk statistics as a package.
  The result falsifies the strong current residual-ruggedness benchmark-adequacy claim
  while preserving only the narrow HYP-005 residual-scale knob.
