summary: Profile conditioning changes the calibrated TrpB landscapes but does not
  consistently improve measured-descriptor agreement over the recorded synthetic control.
  Some median walk and pooled-power comparisons improve; several local epistasis measures
  and many paired seeds worsen.
limitations:
- One previously examined four-site TrpB system; fresh generator seeds are not new
  biological replication.
- Whole-library graph diagnostics include calibration nodes; they are unfitted descriptors,
  not a disjoint genotype test.
- Profile from rounded original frequency table; sequence weights and effective sample
  size unknown. Reference sequences remain computational anchors.
- Observation models are assumptions; shared-stop error is not identified from replicate
  disagreement.
- All optimizer searches reached the fixed 60-iteration budget; no global-optimum
  or convergence claim.
- Local macOS/Clang versus original Linux/Zig; matched numerical versions and checked
  fields do not assert bitwise platform identity.
scientific_acceptance_gate: false
