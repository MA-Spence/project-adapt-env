assessment:
  scope: Achieved RUN-186 fits on the measured four-site TrpB assay; conditional synthetic
    analogue.
  average_behaviour: Partial recovery; shared-stop observed mean and SD close, but
    tail and local variation mismatches remain.
  genetic_architecture: Some equal-cube and sign summaries close; pooled epistatic
    variance differs; no empirical coefficient inference.
  difficulty: Some observed-map structural proxies close; intrinsic maps usually less
    locally trapping; no ML/search performance measured.
  graduation: Broad biological or ML-task equivalence not established; no preset promotion.
  formal_preregistered_adequacy_gate: false
  execution_reproducible: true
  selected_settings_equal_RUN180: true
  model_defaults_changed: false
  new_result_or_claim_created: false
  limitations:
  - one previously studied four-site assay
  - confirmation seeds and empirical panels previously inspected
  - whole-library descriptors include calibration genotypes
  - local variation includes generator seed and assigned cube panel
  - shared-stop is a sensitivity assumption
  - observation noise frozen by genotype, not resampled each query
  - local binary spectra are not full-library coefficient inference
  - structural proxies do not measure task performance
