name: Labproj Compliance

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install labproj
        run: |
          python -m pip install --upgrade pip
          python -m pip install git+https://github.com/RSCJacksonLab/labproj-core pre-commit
      - name: Validate scientific record
        run: |
          labproj refresh --write --strict --fail-on warning --fail-on-change
          labproj check --strict
