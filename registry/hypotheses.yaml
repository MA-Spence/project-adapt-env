- id: HYP-012
  title: Biological-Information-Explains-Conditional-Learning-And-Search-Transitions
  status: active
  created: '2026-11-19T20:10:16+11:00'
  owner: matthew-spence
  aim: AIM-001
  aims:
  - AIM-001
  statement: The alignment of available biological information with the target fitness
    landscape helps explain when function recovery and search are jointly easy, jointly
    hard, or discordant. In the current model, correctly associated family-profile
    information will produce reproducible, task-dependent benefits for information-using
    methods over information-destroyed controls beyond effects explained by generic
    landscape scale and navigation descriptors. A stronger claim that this explains
    biological phenomena requires corresponding predictive evidence on held-out empirical
    systems.
  predictions:
  - Benefits depend on whether the information predicts broadly sampled fitness, accessible
    beneficial changes, or rare target variants; improvement in one need not imply
    improvement in the others.
  - Compare the effect of the information intervention on both recovery and search,
    including interaction with method class and query distribution.
  - Claims concern marginal preferences in the present implementation, not empirical
    interaction identities, contact structure or coevolutionary couplings.
  tested_by: []
  supported_by: []
  weakened_by: []
  refuted_by: []
  superseded_by: []
