- id: HYP-010
  title: Procedural-Landscapes-Provide-Competitive-Computation-And-Efficiency
  status: active
  created: '2026-11-19T20:10:02+11:00'
  owner: matthew-spence
  aim: AIM-001
  aims:
  - AIM-001
  statement: At a declared range of lengths, query workloads and interaction complexities
    relevant to online landscape use, the current sparse low-rank implementation provides
    a reproducible memory and/or time advantage over suitable established implementations
    while retaining the specified landscape capabilities. The claim concerns practical
    costs and a stated trade-off, not novelty of the interaction-expansion/sigmoid
    family or universal dominance.
  predictions:
  - For fixed alphabet, interaction order, degree and rank, storage and full-sequence
    scoring scale approximately linearly with length.
  - Report construction/normalization cost, resident memory, single-query latency,
    batch throughput and mutation-neighborhood evaluation separately.
  - The comparative advantage must survive initialization and sufficiently long workloads
    to reveal amortization, rather than appear only in a favorable cached operation.
  tested_by: []
  supported_by: []
  weakened_by: []
  refuted_by: []
  superseded_by: []
