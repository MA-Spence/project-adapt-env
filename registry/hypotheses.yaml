- id: HYP-008
  title: Local-Non-Diffuse-Ruggedness-Requires-Nonlinear-Trait-Operators
  status: superseded
  created: '2026-05-16T11:04:25+10:00'
  owner: matthew-spence
  aim: AIM-001
  aims:
  - AIM-001
  statement: Real protein fitness landscapes contain local, non-diffuse ruggedness
    generated by nonlinear interactions among molecular traits, and the current smooth-core
    plus diffuse residual model will not capture that behaviour as a biologically
    grounded procedural benchmark.
  predictions:
  - Empirical graphlets will show ruggedness concentrated in specific local sequence,
    structural, or trait regions rather than uniformly across sampled backgrounds.
  - Nonlinear operators combining multiple latent molecular traits should match empirical
    SE/RSE, local maxima, accessibility, random-walk autocorrelation, and WHT/GFT
    spectra better than the current smooth-core-only or diffuse residual models.
  - The improvement must persist after controlling for parameter count, global readout
    nonlinearity, residual-only overfitting, and stale empirical preprocessing.
  - If the current model family is sufficient, matched single-trait stability-margin
    models or diffuse residual controls should equal or outperform local nonlinear-operator
    variants on held-out graphlets.
  tested_by:
  - EXP-031
  - EXP-032
