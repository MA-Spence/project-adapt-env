- id: HYP-004
  title: Adaptive-Walk-Dynamics-And-Peak-Proximal-Epistasis-Are-Biological
  status: active
  created: '2026-05-07T16:18:34+10:00'
  owner: matthew-spence
  aim: AIM-001
  aims:
  - AIM-001
  statement: A biologically useful synthetic landscape should reproduce evolutionary
    search behaviour seen in real rugged landscapes, including plausible random and
    adaptive walks, diminishing returns near high-fitness genotypes, and systematic
    changes in epistasis as sequences approach a peak.
  predictions:
  - Random walks and one-step adaptive walks should show early accessible gains, decelerating
    improvement near high-fitness regions, and nonzero probability of stalling on
    local optima.
  - The beneficial fraction and mean available beneficial effect size should decline
    as sequences get closer to the relevant local peak.
  - Epistasis should become more constraining near peaks, with increased negative
    or diminishing-returns epistasis and changed sign-epistasis prevalence relative
    to distant low-fitness regions.
  - These patterns should be reproducible across seeds and family-like backgrounds
    without evaluating machine-learning models or benchmark strategy rankings.
