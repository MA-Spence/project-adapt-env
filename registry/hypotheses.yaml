- id: HYP-011
  title: Learnability-And-Searchability-Form-Separable-Landscape-Regimes
  status: active
  created: '2026-11-19T20:10:16+11:00'
  owner: matthew-spence
  aim: AIM-001
  aims:
  - AIM-001
  statement: Under declared recovery and search tasks, the current landscape family
    contains reproducible regimes spanning easy/easy, easy/hard, hard/easy and hard/hard
    recovery/search behavior. Landscape structure can explain differences between
    the tasks beyond a single ruggedness statistic or interaction-strength parameter.
    This predicts coverage of the quadrants, not arbitrary independent control of
    both axes or universal labels across algorithms and budgets.
  predictions:
  - Recovery learning curves and fitness-target attainment curves need not rank regimes
    identically.
  - Interaction support, order, amplitude and rank may affect representation complexity
    and navigation differently.
  - Measure recovery on a fixed external test distribution and search on its declared
    target; retain seed/start variation and algorithm dependence.
  - Distinguish sample complexity from training/inference compute and from optimization
    compute.
  tested_by: []
  supported_by: []
  weakened_by: []
  refuted_by: []
  superseded_by: []
