- id: HYP-005
  title: Mechanistic-Knobs-Produce-Monotonic-Directional-Effects
  status: active
  created: '2026-05-07T16:18:34+10:00'
  owner: matthew-spence
  aim: AIM-001
  aims:
  - AIM-001
  statement: The model knobs intended to represent biological concepts should move
    validation metrics in the expected direction over broad parameter sweeps.
  predictions:
  - Increasing stability margin
  - functional dimensionality
  - epistasis strength
  - covariation bias
  - and noise settings should each induce directional changes in their target validation
    metrics with effect sizes that are larger than seed-to-seed variation.
