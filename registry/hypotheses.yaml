items:
- id: HYP-001
  title: Local-Protein-Landscape-Statistics-Without-Exact-Reconstruction
  status: active
  created: '2026-05-07T16:18:33+10:00'
  owner: matthew-spence
  aim: AIM-001
  aims:
  - AIM-001
  statement: A hybrid synthetic landscape built from a stability threshold, a low-dimensional
    functional layer, and sparse structured epistasis can match empirical local summary
    statistics from real protein landscapes without attempting to reconstruct any
    one assay exactly.
  predictions:
  - Across a panel of empirical assays
  - one shared synthetic parameter regime should reproduce DFE shape
  - neutrality
  - beneficial fraction
  - and fitness-dependent mutational-effect trends at the level of summary statistics
    without assay-specific fitting.
  tested_by:
  - EXP-001
  - EXP-002
  - EXP-003
