- id: HYP-002
  title: Benchmark-Certified-Peak-Mode-Preserves-Local-Realism
  status: active
  created: '2026-05-07T16:18:33+10:00'
  owner: matthew-spence
  aim: AIM-001
  aims:
  - AIM-001
  statement: A benchmark-facing landscape mode that certifies or tightly controls
    the top of the landscape will make optimization metrics interpretable while preserving
    the local DFE and epistasis properties needed for realism.
  predictions:
  - A certified-top mode should reduce peak overshoot and reference-to-peak ambiguity
    while keeping local DFE
  - global epistasis
  - and neutrality metrics within pre-specified tolerances of the biological mode.
