- id: HYP-009
  title: Benchmark-Legible-Ruggedness-Routing-Affects-Optimizer-Performance
  status: active
  created: '2026-05-18T12:41:28+10:00'
  owner: matthew-spence
  aim: AIM-001
  aims:
  - AIM-001
  statement: For ML benchmark use, alignment- or covariation-routed coupled ruggedness
    does not need to improve empirical landscape fit over random, shuffled, no-module,
    or uncoupled capacity controls. Its role is to provide biologically legible sequence
    structure that pretrained protein language models and evolution-aware active-learning
    agents may exploit, while the global and local ruggedness statistics are matched
    by construction.
  predictions:
  - When coupled regimes are matched for global and local ruggedness statistics, PLM-
    or evolution-aware agents should perform differently on biologically routed landscapes
    than on random-routed, shuffled-routed, no-module, uncoupled, or diffuse-residual
    regimes.
  - Non-biological optimizers should be less sensitive to routing identity once global
    ruggedness, local ruggedness, observation noise, and evaluation budget are matched.
  - Any biologically routed advantage must survive replicated seeds, matched budget/noise
    conditions, and ablations where comparable ruggedness statistics are routed through
    random or shuffled modules.
  - If routing identity changes all optimizers similarly, or if apparent gains are
    explained by easier landscape statistics rather than biological legibility, the
    benchmark interpretation is weakened.
  tested_by:
  - EXP-040
