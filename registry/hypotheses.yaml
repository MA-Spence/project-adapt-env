- id: HYP-003
  title: Real-MSA-Conditioning-Improves-Realism-Over-Synthetic-Conditioning
  status: active
  created: '2026-05-07T16:18:33+10:00'
  owner: matthew-spence
  aim: AIM-001
  aims:
  - AIM-001
  statement: Conditioning the landscape on real family MSAs will improve conservation-sensitivity
    structure and pairwise epistasis placement more than conditioning on internally
    generated synthetic alignments.
  predictions:
  - Real MSA conditioning should outperform synthetic-alignment conditioning on held-out
    conservation-effect correlation
  - covariation-epistasis enrichment
  - and natural-sequence plausibility metrics.
