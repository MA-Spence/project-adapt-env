- id: HYP-004
  title: Benchmark-Regimes-Separate-Search-Strategies-Reproducibly
  status: active
  created: '2026-05-07T16:18:34+10:00'
  owner: matthew-spence
  aim: AIM-001
  aims:
  - AIM-001
  statement: A scientifically useful synthetic benchmark should produce reproducible
    performance separation between qualitatively different optimization strategies
    across budgets, start states, and noise levels.
  predictions:
  - Across seeds and budgets
  - strategy rankings should be stable enough that random search
  - local mutagenesis
  - recombination
  - and uncertainty-aware active learning do not collapse into one indistinguishable
    performance class.
