- id: HYP-006
  title: Observation-Noise-Is-Realistic-And-Does-Not-Destabilize-Conclusions
  status: active
  created: '2026-05-07T16:18:34+10:00'
  owner: matthew-spence
  aim: AIM-001
  aims:
  - AIM-001
  statement: A useful active-learning benchmark needs an observation model that perturbs
    ranking and uncertainty in a realistic way, but does not erase meaningful differences
    between strategies.
  predictions:
  - Empirically grounded noise models should change local rankings and search difficulty
  - but strategy ordering and top-k recovery should remain statistically stable over
    practical noise ranges.
