question: Is the RUN-079 no-module held-out PHOT graphlet improvement stable across
  replicated calibration/test graphlet splits, or is it a split artifact?
pre_experiment_prediction: If the no-module coupled-operator signal is real, calibration-selected
  no-module candidates should beat fitted-current, smooth-core, empirical-module,
  random-module, and shuffled-module controls on held-out graphlet distance across
  most replicated splits and should improve secondary WHT/topology/dynamics components
  rather than one component only. If the advantage is split-specific, the median and
  win-rate against fitted current should collapse or be matched by random/shuffled
  controls.
rationale: RUN-079 gave the strongest held-out positive signal for HYP-008, but it
  was observed on one fixed calibration/test graphlet split and did not validate local
  empirical modules. This experiment keeps the same PHOT base and candidate families
  and resamples the split many times to test whether the no-module improvement is
  robust before any new operator is proposed.
