question: Does paired surface trafficking plus ion-conduction function on KCNJ2_MOUSE
  support a two-trait state/function calibration better than a function-only single-trait
  fit?
pre_experiment_prediction: If the multi-latent direction is more appropriate for mechanistically
  separable non-folding-limited assays, then KCNJ2_MOUSE surface abundance plus channel
  function should benefit from a state/function decomposition relative to a function-only
  single-trait fit. Because the assays contain single mutants only, this experiment
  will not test double-mutant epistasis recovery.
rationale: KCNJ2_MOUSE separates surface trafficking from potassium-channel function,
  giving a cleaner biological split than PHOT scalar fluorescence and a different
  paired-readout system than KRAS abundance/binding. It is therefore an appropriate
  single-mutant diagnostic of whether measured state and function traits are non-redundant
  for HYP-007.
