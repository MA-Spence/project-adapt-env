question: Does the EXP-060 mutation-normalized GNK field transmit length-stable local
  mutational texture through the public sigmoid, and is any loss attributable to operating-point
  saturation rather than renewed latent scale failure?
pre_experiment_prediction: At central occupancies and small signal, paired observable
  mutation effects will track latent GNK effects without a renewed length trend, whereas
  the public margin-8 operating point will strongly attenuate transmission except
  at threshold crossings.
rationale: RES-058 validates latent scale laws but leaves nonlinear transmission untested;
  paired full-minus-core residuals isolate sigmoid transmission while matched controls
  distinguish operating-point attenuation and sigmoid-curvature epistasis from GNK
  texture.
