notes:
- The documented `.config.yaml` base defaults and natural-single-domain template use
  stability margin 8, while a bare LandscapeConfig constructor defaults to margin
  10 and named API presets vary. There is no universal service/API margin; the margin-8
  base-template formula is the primary decision point and margin 10 is the separately
  labelled constructor comparator.
- Pointwise occupancy calibration changes theta per genotype and is therefore a transfer-function
  assay only. Edge, plaquette, and topology estimands use one frozen theta per reference/seed/readout
  arm.
- The order-1 mutation-RMS-matched surrogate is a required control for epistasis introduced
  by sigmoid curvature rather than latent GNK interactions.
- A candidate-additivized plaquette counterfactual holds the three lower-corner GNK
  values fixed and removes only latent double-mutant curvature; tau_texture is the
  primary transmitted-texture estimand.
- Direct float64 and stable analytic residuals are both retained because the public
  margin can make nonzero mathematical residuals exact numerical ties.
- A pass would support HYP-005 only for transmission at the declared operating point.
  The primary arm substitutes the candidate for the public generator and disables
  service noise, so it would not validate the current generator/service end to end,
  empirical realism, or optimizer performance.
- Texture projection, practical resolution, permutation evidence, and the controlled
  texture length slope are gated per protein length so pooled short proteins cannot
  conceal an L>=100 failure. The 0.10 resolution floor is a heuristic for this noiseless
  assay, not a service detection threshold.
- EXP-060 used 384 raw legacy terms for its scale-defect control. EXP-061 intentionally
  uses the current base public value of 256 terms and labels it as a new current-public
  comparator rather than the identical prior control.
