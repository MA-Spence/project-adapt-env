      blosum_blend_grid: [0.25, 0.5, 0.75]
      stability_conservation_power_grid: [0.75, 1.0, 1.25]
      stability_margin_grid: [5.0, 8.0, 12.0]
      functional_sigma_grid: [12.0, 20.0, 28.0]
      n_functional_dims_grid: [2, 4, 6]
      peak_distance_grid: [0, 1, 3]
      epistasis_strength_grid: [0.0, 0.025, 0.05]
      empirical_pairwise_strength_grid: [0.0, 0.025, 0.05]
      noise_amplitude_grid: [0.0, 0.003, 0.006]
      functional_core_objective: dfe_objective
      functional_fit_strategy: iterative
