id: EXP-004
type: experiment
title: ProteinGym Predictive Joint Calibration And Pairwise Capacity Panel
slug: proteingym-predictive-joint-calibration-pairwise-capacity-panel
status: planned
created: '2026-05-08T16:39:51+10:00'
owner: matthew-spence
scientific_context:
  aims:
  - AIM-001
  hypotheses:
  - HYP-001
  previous_experiments:
  - EXP-001
  - EXP-003
  motivating_results:
  - RES-001
  - RES-002
  - RES-003
question: Does HYP-001 hold more cleanly on the fixed EXP-003 six-assay ProteinGym
  stability panel when calibration is changed from a staged summary-matching fit to
  a predictive joint fit and when empirical pairwise epistasis is represented with
  less aggressive compression?
pre_experiment_prediction: Relative to the EXP-003 baseline, a predictive joint objective
  should improve single- and double-mutant holdout recovery on the shared raw-score
  branch, and relaxing empirical pairwise compression should further improve double-mutant
  and epistasis-prediction metrics while reducing collapse to zero epistasis strength.
  If calibration was the main bottleneck, the improved shared raw branch should approach
  the improved per-assay ceiling more closely than in EXP-003.
rationale: 'RES-002 showed that the Adapt-Env family spans broad local DFE envelopes,
  while RES-003 showed that coordinate-aware preprocessing alone does not rescue empirical
  calibration. This experiment is run to isolate two remaining calibration bottlenecks:
  the staged summary-first objective and the strongly compressed empirical pairwise
  epistasis representation. It fixes the panel to the exact six multi-mutant Tsuboyama
  stability assays used in EXP-003, then compares baseline and improved calibration
  branches on the same raw and latent assay constructions.'
