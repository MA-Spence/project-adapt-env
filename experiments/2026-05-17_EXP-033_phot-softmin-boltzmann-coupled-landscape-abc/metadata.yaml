  - RES-032
question: 'For PHOT, does a frozen RUN-077 base landscape combined with a correlated
  auxiliary landscape through a temperature-controlled soft-min/Boltzmann state-competition
  operator improve held-out graphlet topology, spectra, and locality relative to matched
  controls?

  '
pre_experiment_prediction: 'A supporting result requires posterior concentration on
  finite tau and correlated auxiliary parameters that improve held-out graphlet distance
  and locality without losing base correlation. Assay-objective improvement alone
  is not sufficient support for HYP-008.

  '
rationale: 'RES-032 showed that strict hard-min coupling improves the PHOT full-assay
  objective but fails the held-out graphlet and locality controls. EXP-033 tests whether
  a softer thermodynamic state-competition operator avoids that failure while keeping
  the base landscape fixed for identifiability.

  '
