question: After accounting for stability and a photophysical readout trait, is the
  remaining PHOT_CHLRE mismatch explained by sparse residual epistasis rather than
  by the latent mapping itself?
pre_experiment_prediction: If PHOT fluorescence depends on a brightness or FMN-occupancy
  trait plus a small set of specific interactions, then adding sparse residual epistasis
  after the additive latent readout should improve epistasis prediction and double-mutant
  recovery more than broad extra latent capacity does.
rationale: PHOT_CHLRE reports CreiLOV fluorescence rather than a clean activity phenotype.
  The missing trait may be photophysical brightness or FMN occupancy, and residual
  pairwise structure may identify specific chromophore-pocket or allosteric interactions
  rather than generic ruggedness.
