  hypotheses:
  - HYP-004
  - HYP-005
  previous_experiments:
  - EXP-022
  motivating_results:
  - RES-022
question: Can DCA-prior, state-specific pairwise epistasis alone create local topological
  ruggedness, sign epistasis, and constrained adaptive paths in a TEM-1 stability-margin
  landscape when the old generic low-rank epistasis layer is disabled?
pre_experiment_prediction: If smooth low-rank pairwise terms were the limiting architecture,
  then sparse DCA-selected state-specific compensatory and incompatibility terms should
  produce measurable reciprocal/sign epistasis, local optima, reduced random-walk
  autocorrelation, and restricted monotonic paths on dense 2^k local Hamming graphs.
rationale: RUN-059 showed that increasing generic epistasis magnitude can create pairwise
  nonadditivity but leaves random walks highly autocorrelated and sign epistasis nearly
  absent. This experiment isolates a more biologically specific architecture by routing
  DCA-prior state-specific pair terms into latent stability and disabling the old
  generic pairwise and higher-order epistasis layers.
