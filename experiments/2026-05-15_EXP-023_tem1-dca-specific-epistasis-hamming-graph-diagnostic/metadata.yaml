id: EXP-023
type: experiment
title: TEM-1 DCA-specific epistasis dense Hamming graph diagnostic
slug: tem1-dca-specific-epistasis-hamming-graph-diagnostic
status: planned
created: '2026-05-15T12:29:00+10:00'
owner: matthew-spence
