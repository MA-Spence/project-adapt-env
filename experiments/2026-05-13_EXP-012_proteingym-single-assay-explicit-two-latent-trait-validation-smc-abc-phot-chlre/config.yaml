experiment_id: EXP-012
title: ProteinGym Single-Assay Explicit Two-Latent-Trait Validation-Objective SMC-ABC Diagnostic for PHOT_CHLRE
stack: STACK-000
target: lab-slurm
experiment:
  id: EXP-012

proteingym:
  version: v1.3
  reference_csv_url: https://raw.githubusercontent.com/OATML-Markslab/ProteinGym/main/reference_files/DMS_substitutions.csv
  substitutions_parquet_url: https://proteingym.s3.us-east-2.amazonaws.com/DMS_substitutions.parquet
  reference_csv_path: data/raw/proteingym/v1.3/reference/DMS_substitutions.csv
  substitutions_parquet_path: data/raw/proteingym/v1.3/DMS_substitutions.parquet
  assay_output_dir: data/raw/proteingym/v1.3/assays

panel:
  panel_size: 1
  assays_per_taxon: 1
  allowed_taxa:
    - Eukaryote
  coarse_selection_type: Activity
  selection_type: FACS
  require_multiple_mutants: true
  min_single_mutants: 1000
  min_multiple_mutants: 30000
  max_sequence_length: 140
  assay_ids:
    - PHOT_CHLRE_Chen_2023

mmseqs:
  alignment_dir: data/interim/proteingym_mmseqs_alignments
  cache_dir: data/interim/proteingym_mmseqs_cache
  max_alignment_sequences: 512
  timeout_seconds: 20.0
  poll_interval_seconds: 5.0
  max_retries: 6

mavenn:
  alphabet: protein
  regression_type: GE
  gpmap_type: additive
  ge_nonlinearity_type: nonlinear
  ge_nonlinearity_monotonic: true
  ge_noise_model_type: SkewedT
  ge_heteroskedasticity_order: 2
  theta_regularization: 0.0001
  eta_regularization: 0.0001
  max_mutation_count: 3
  max_variants_per_assay: 12000
  sample_seed: 17
  test_holdout_modulo: 10
  test_holdout_remainder: 0
  report_information_metrics: false
  validation_fraction: 0.1
  epochs: 60
  learning_rate: 0.005
  early_stopping_patience: 8
  batch_size: 256

adapt_env:
  base_config:
    stability_margin: 8.0
    stability_scale: 1.0
    stability_conservation_power: 1.0
    threshold_steepness: 20.0
    n_functional_dims: 1
    functional_sigma_base: 18.0
    functional_sigma_anisotropy: 0.0
    functional_weight: 1.0
    latent_trait_blocks:
      - name: readout
        dims: 1
        sigma_base: 18.0
        sigma_anisotropy: 0.0
        weight: 1.0
        use_conservation_scaling: true
    observed_fitness_combine_mode: product
    observed_fitness_terms:
      - source: stability_gate
      - source: trait:readout:capacity
    generic_epistasis_target: score
    fitness_output_scale: 10.0
    n_epistatic_terms: 1
    epistasis_strength: 0.0
    empirical_pairwise_strength: 0.02
    pairwise_epistasis_rank: 2
    epistasis_order_max: 2
    epistasis_order_decay: 2.0
    n_higher_order_epistatic_terms: 0
    epistasis_covariation_bias: 0.8
    noise_amplitude: 0.0
    noise_heterogeneity: 0.0
    peak_search_steps: 400
    peak_search_top_single_starts: 8
    peak_search_random_starts: 8
    peak_search_random_radius: 2
    peak_distance_from_consensus: 2
    use_blosum_kernel: true
    blosum_blend: 0.5
    seed: 42

calibration_max_mutation_count: 2

deterministic_branches:
  baseline_shared_two_trait_readout:
    source: raw
    calibration:
      neutral_threshold: 0.25
      beneficial_threshold: 0.25
      lethal_relative_threshold: 0.1
      max_landscapes_per_fit: 6
      max_observed_sequences: 4096
      max_double_mutants: 2048
      synthetic_seed: 1321
      query_missing_alignments: false
      single_mutant_holdout_modulo: 5
      single_mutant_holdout_remainder: 0
      double_mutant_holdout_modulo: 5
      double_mutant_holdout_remainder: 0
      synthetic_readout_mode: fitness
      empirical_pairwise_target: trait:readout
      observation_model_kind: auto
      observation_model_max_knots: 12
      observation_model_min_bin_size: 16
      stability_scale_grid: [0.5, 1.0, 1.5]
      blosum_blend_grid: [0.25, 0.5, 0.75]
      stability_conservation_power_grid: [0.75, 1.0, 1.25]
      stability_margin_grid: [5.0, 8.0, 12.0]
      functional_sigma_grid: [10.0, 18.0, 28.0]
      n_functional_dims_grid: [1]
      peak_distance_grid: [2]
      epistasis_strength_grid: [0.0]
      empirical_pairwise_strength_grid: [0.0]
      noise_amplitude_grid: [0.0]
      functional_core_objective: dfe_objective
      functional_fit_strategy: staged
      dfe_predictive_holdout_weight: 5.0
      dfe_predictive_rank_weight: 3.0
      dfe_double_predictive_weight: 1.5
      reference_peak_fraction_max: 0.85
      reference_peak_fraction_weight: 1.0
      reference_peak_distance_min: 1
      reference_peak_distance_weight: 0.5

  predictive_richpair_shared_two_trait_readout:
    source: raw
    calibration:
      neutral_threshold: 0.25
      beneficial_threshold: 0.25
      lethal_relative_threshold: 0.1
      max_landscapes_per_fit: 6
      max_observed_sequences: 8192
      max_double_mutants: 8192
      synthetic_seed: 1777
      query_missing_alignments: false
      single_mutant_holdout_modulo: 5
      single_mutant_holdout_remainder: 0
      double_mutant_holdout_modulo: 5
      double_mutant_holdout_remainder: 0
      double_mutant_holdout_scheme: pair
      synthetic_readout_mode: fitness
      empirical_pairwise_target: trait:readout
      observation_model_kind: auto
      observation_model_max_knots: 12
      observation_model_min_bin_size: 16
      stability_scale_grid: [0.5, 1.0, 1.5]
      blosum_blend_grid: [0.25, 0.5, 0.75]
      stability_conservation_power_grid: [0.75, 1.0, 1.25]
      stability_margin_grid: [5.0, 8.0, 12.0]
      functional_sigma_grid: [10.0, 18.0, 28.0]
      n_functional_dims_grid: [1]
      peak_distance_grid: [2]
      epistasis_strength_grid: [0.0]
      empirical_pairwise_strength_grid: [0.0, 0.025, 0.05]
      noise_amplitude_grid: [0.0]
      empirical_pairwise_model: regularized_low_rank
      empirical_pairwise_max_pairs: 0
      empirical_pairwise_rank: 4
      empirical_pairwise_prior_strength: 1.0
      empirical_pairwise_shared_template_weight: 0.0
      empirical_pairwise_observed_prior_blend: 0.0
      empirical_pairwise_coverage_shrink_power: 0.0
      empirical_pairwise_normalization: none
      functional_core_objective: dfe_objective
      functional_fit_strategy: iterative
      functional_joint_rounds: 3
      dfe_predictive_holdout_weight: 5.0
      dfe_predictive_rank_weight: 3.0
      dfe_double_predictive_weight: 1.5
      reference_peak_fraction_max: 0.85
      reference_peak_fraction_weight: 1.0
      reference_peak_distance_min: 1
      reference_peak_distance_weight: 0.5

abc:
  distance_mode: validation_objective
  backend:
    kind: ray
    max_workers: 6
    batch_size: 6
  selected_features: []
  bootstrap_replicates: 0
  covariance_shrinkage: 0.35
  covariance_ridge: 1.0e-6
  replicates_per_particle: 2
  calibration:
    neutral_threshold: 0.25
    beneficial_threshold: 0.25
    lethal_relative_threshold: 0.1
    max_landscapes_per_fit: 6
    max_observed_sequences: 8192
    max_double_mutants: 8192
    synthetic_seed: 2357
    query_missing_alignments: false
    single_mutant_holdout_modulo: 5
    single_mutant_holdout_remainder: 0
    double_mutant_holdout_modulo: 5
    double_mutant_holdout_remainder: 0
    double_mutant_holdout_scheme: pair
    synthetic_readout_mode: fitness
    empirical_pairwise_target: trait:readout
    observation_model_kind: auto
    observation_model_max_knots: 12
    observation_model_min_bin_size: 16
    empirical_pairwise_model: regularized_low_rank
    empirical_pairwise_max_pairs: 0
    empirical_pairwise_rank: 4
    empirical_pairwise_prior_strength: 1.0
    empirical_pairwise_shared_template_weight: 0.0
    empirical_pairwise_observed_prior_blend: 0.0
    empirical_pairwise_coverage_shrink_power: 0.0
    empirical_pairwise_normalization: none
    functional_core_objective: dfe_objective
    functional_fit_strategy: iterative
    functional_joint_rounds: 3
    stability_scale_grid: [0.5, 1.0, 1.5]
    blosum_blend_grid: [0.25, 0.5, 0.75]
    stability_conservation_power_grid: [0.75, 1.0, 1.25]
    stability_margin_grid: [5.0, 8.0, 12.0]
    functional_sigma_grid: [10.0, 18.0, 28.0]
    n_functional_dims_grid: [1]
    peak_distance_grid: [2]
    epistasis_strength_grid: [0.0]
    empirical_pairwise_strength_grid: [0.0, 0.02, 0.05, 0.08]
    noise_amplitude_grid: [0.0]
    dfe_predictive_holdout_weight: 5.0
    dfe_predictive_rank_weight: 3.0
    dfe_double_predictive_weight: 1.5
    reference_peak_fraction_max: 0.85
    reference_peak_fraction_weight: 1.0
    reference_peak_distance_min: 1
    reference_peak_distance_weight: 0.5
  parameters:
    - name: stability_scale
      kind: float
      low: 0.5
      high: 1.5
    - name: stability_margin
      kind: float
      low: 5.0
      high: 12.0
    - name: blosum_blend
      kind: float
      low: 0.2
      high: 0.8
    - name: stability_conservation_power
      kind: float
      low: 0.75
      high: 1.25
    - name: functional_sigma_base
      kind: float
      low: 10.0
      high: 30.0
    - name: empirical_pairwise_strength
      kind: float
      low: 0.0
      high: 0.08
  smc:
    n_particles: 64
    n_rounds: 4
    initial_pool_multiplier: 6
    proposal_pool_multiplier: 8
    epsilon_quantile: 0.6
    seed: 2026

synthetic_truth_recovery:
  enabled: false

resume: {}

quick:
  panel:
    panel_size: 1
    assay_ids:
      - PHOT_CHLRE_Chen_2023
  mavenn:
    max_variants_per_assay: 2000
    epochs: 5
    early_stopping_patience: 2
    batch_size: 128
  deterministic_branches:
    baseline_shared_two_trait_readout:
      calibration:
        max_observed_sequences: 1024
        max_double_mutants: 512
    predictive_richpair_shared_two_trait_readout:
      calibration:
        max_observed_sequences: 1024
        max_double_mutants: 1024
  abc:
    replicates_per_particle: 1
    smc:
      n_particles: 16
      n_rounds: 2
      initial_pool_multiplier: 4
      proposal_pool_multiplier: 4
      epsilon_quantile: 0.7
      seed: 111
