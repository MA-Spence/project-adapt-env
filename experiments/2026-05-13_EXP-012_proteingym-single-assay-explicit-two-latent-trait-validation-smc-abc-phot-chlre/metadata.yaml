id: EXP-012
type: experiment
title: ProteinGym Single-Assay Explicit Two-Latent-Trait Validation-Objective SMC-ABC
  Diagnostic for PHOT_CHLRE
slug: proteingym-single-assay-explicit-two-latent-trait-validation-smc-abc-phot-chlre
status: planned
