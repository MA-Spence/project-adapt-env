question: Does an explicit two-latent-trait PHOT_CHLRE fit, with stability plus
  one fitted readout trait and only empirical pairwise structure routed into that
  readout trait, improve recovery once the Bayesian distance is the held-out predictive
  validation objective rather than a bootstrap summary-vector target?
pre_experiment_prediction: If the earlier PHOT failures were partly caused by implicit
  legacy-block fitting, competing epistasis levers, and an objective mismatch, then
  this explicit two-trait formulation should improve double-mutant holdout, epistasis
  prediction, and reference geometry relative to RES-008 and RES-009.
rationale: >-
  Later code review narrowed what RES-008 and RES-009 actually tested. Those
  runs changed readout semantics, but they did not yet fit an explicit second
  latent trait block and still optimized the Bayesian fit against
  summary-vector matching rather than the held-out predictive metrics used in
  the analysis. EXP-012 is the direct replacement test: one explicit readout
  trait block, stability as the other latent trait, no generic score-space
  epistasis, only empirical pairwise structure routed into the readout trait,
  and a Bayesian objective aligned with the intended evaluation package.
