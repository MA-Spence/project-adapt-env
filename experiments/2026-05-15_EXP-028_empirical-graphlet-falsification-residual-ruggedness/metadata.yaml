id: EXP-028
type: experiment
title: Empirical graphlet falsification suite for residual ruggedness model
slug: empirical-graphlet-falsification-residual-ruggedness
status: planned
created: '2026-05-15T21:57:57+10:00'
owner: matthew-spence
