  motivating_results:
  - RES-025
  - RES-026
  - RES-027
question: Do the six explicit falsifiers for the smooth-core plus fixed-scale residual
  ruggedness mechanism hold when empirical ProteinGym graphlets, nonlinear readout
  controls, matched residual controls, and RUN-069-style synthetic graphlets are evaluated
  in one paired diagnostic suite?
pre_experiment_prediction: If the model structure is scientifically defensible, empirical
  graphlets should show low-order-dominated spectra with a measurable high-order tail;
  smooth-core-only and additive global-readout controls should not match empirical
  SE/RSE/topology as well as residual models; increasing fixed residual scale should
  remain directional across synthetic seeds; contact residuals should outperform random-position,
  shuffled-contact, and GNK controls on joint empirical distance; and high-order signal
  should not disappear after global-readout correction.
rationale: 'RES-027 supports the fixed residual-scale knob procedurally but leaves
  six explicit falsifiers unresolved: smooth-core-only empirical fit, no residual-scale
  effect, wrong empirical spectral envelope, control equivalence, wrong evolutionary
  dynamics, and scale confounding. This experiment tests those breakpoints directly
  while keeping output columns comparable to RUN-067 and RUN-069.'
