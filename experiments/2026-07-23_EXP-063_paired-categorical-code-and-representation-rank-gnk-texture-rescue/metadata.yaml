id: EXP-063
type: experiment
title: Paired categorical-code and representation-rank GNK texture rescue
slug: paired-categorical-code-and-representation-rank-gnk-texture-rescue
status: completed
created: '2026-07-23T16:51:19+10:00'
owner: matthew-spence
scientific_context:
  aims:
  - AIM-001
  hypotheses:
  - HYP-005
  previous_experiments:
  - EXP-062
  motivating_results:
  - RES-060
question: At fixed support topology, mutation-operator energy, additive core, and
  sigmoid readout, do dense q20 allele coding and/or rank-8 categorical tensor components
  rescue the practical prevalence of transmitted GNK texture?
pre_experiment_prediction: Dense q20 rank-1 will improve texture prevalence if binary
  allele ties are sufficient to explain the failure; rank-8 arms will pass the frozen
  EXP-062 observable gates if tensor rank is additionally limiting, while incumbent
  binary rank-1 will reproduce the prevalence failure.
rationale: RES-060 established global core calibration, complete-h1 edge transfer,
  aligned GNK texture, dose directionality, and length stability, but only 24/360
  cells passed the practical texture-prevalence floor. The paired intervention changes
  only categorical coding and representation rank while preserving topology and mutation
  energy, directly testing the identified low-rank binary bottleneck.
