  - RES-026
question: Does scanning fixed residual-to-additive scale ratios reveal a threshold
  where high-order residual variance becomes exposed as adaptive-walk additive gains
  diminish, without using graphlet-local DFE normalization?
pre_experiment_prediction: If the corrected relative-scale mechanism is present, increasing
  fixed residual scale should monotonically increase residual exposure, WHT high-order
  fraction, SE/RSE, local maxima, reduced accessibility, and shorter random-walk autocorrelation,
  with stronger effects in later walk stages where available beneficial effects are
  smaller. Smooth-core, pairwise, exact-match, placement, and GNK controls distinguish
  this from direct local scaling or non-procedural ruggedness.
rationale: RES-026 showed that the locally DFE-scaled contact residual creates topology
  but is not the intended fixed residual/additive mechanism. This repeat removes the
  local-DFE primary calibration setting, scans fixed residual scale values directly,
  and reduces evaluated graphlets by the scale-grid size so the primary scale-sweep
  workload remains comparable to the previous single-scale diagnostic.
