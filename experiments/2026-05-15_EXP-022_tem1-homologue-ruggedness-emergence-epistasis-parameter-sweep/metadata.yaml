question: At what epistatic density, strength, rank, covariation bias, and higher-order
  term settings does the TEM-1 homologue stability-margin landscape stop behaving
  as a nearly smooth additive landscape and begin showing measurable ruggedness in
  pairwise epistasis and random-walk diagnostics?
pre_experiment_prediction: If the RUN-057 smoothness arose because epistasis terms
  were too sparse and weak relative to the additive stability layer, then increasing
  pairwise density and strength, using higher-rank pairwise matrices, enriching placement
  toward covarying MSA positions, and adding sparse higher-order exact-match terms
  should increase nonzero and strong pairwise epistasis, increase random-walk step
  variance, reduce random-walk autocorrelation/correlation length, and potentially
  increase sign or diminishing-returns epistasis. If the landscape remains smooth,
  then the current stability-margin readout is damping or hiding epistatic ruggedness
  even under stress settings.
rationale: RES-021 supports the TEM-1 homologue consensus-distance adaptive-walk diagnostic
  but shows that RUN-057 used epistasis settings that left the random walks almost
  perfectly autocorrelated and sampled sign epistasis absent. This experiment repeats
  the EXP-021 TEM-1 design while sweeping stronger, denser, higher-rank, and covariation-enriched
  epistasis regimes to isolate where ruggedness emerges and to test HYP-005 knob directionality
  more directly.
