question: Does the simpler stability-targeted single-latent calibration used in RES-007
  recover the PHOT_CHLRE activity assay better than the recent activity-specific formulations,
  or are the PHOT failures robust even under that simpler control?
pre_experiment_prediction: If the negative PHOT results mainly reflect over-parameterization
  or confounding in the newer activity-specific formulations, then reverting to the
  simpler RES-007 stability-targeted calibration may improve holdout ranking and epistasis
  metrics on PHOT_CHLRE despite its causal mismatch. If it does not, that would strengthen
  the case that the assay-model mismatch is more fundamental.
rationale: RES-007 showed that a stability-targeted readout materially improved recovery
  on a matched unfolding assay, while RES-008 and RES-009 showed that two richer PHOT_CHLRE
  activity formulations still did not rescue the same activity landscape. Before attributing
  that failure entirely to missing latent causal structure, this control tests whether
  the simpler single-latent stability-targeted fitter from RES-007 can recover PHOT_CHLRE
  better than the newer activity-oriented versions. A positive control result would
  suggest that the current multi-latent activity parameterization is harder to fit
  than necessary; a negative control result would imply that the PHOT assay itself
  is poorly matched to the stability-only causal chain.
