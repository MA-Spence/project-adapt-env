question: Does paired expression plus enzyme activity on OXDA_RHOTO support a two-trait
  state/function calibration better than a function-only single-trait fit?
pre_experiment_prediction: If HYP-007 is failing on KRAS/PHOT partly because the tested
  systems are structurally mismatched, then OXDA_RHOTO expression plus enzymatic activity
  should show improved activity holdout recovery or readout agreement when expression
  constrains the state/stability-facing layer and activity constrains a separate function-facing
  layer. Because the assays contain single mutants only, this experiment will not
  test double-mutant epistasis recovery.
rationale: OXDA_RHOTO provides matched ProteinGym expression and enzyme-activity measurements
  with weak readout correlation, making it an immediate non-KRAS paired-readout diagnostic
  for HYP-007. The system is not merely a folding/proteolysis assay, but the absence
  of multiple mutants limits inference to single-mutant recovery and cross-readout
  structure.
