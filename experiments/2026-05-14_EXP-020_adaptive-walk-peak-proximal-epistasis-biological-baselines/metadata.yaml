  - HYP-004
  previous_experiments: []
  motivating_results: []
question: 'Do current AdaptEnv stability-margin landscapes reproduce literature-supported
  evolutionary-landscape behaviours: adaptive walks with decelerating gains, declining
  beneficial-mutation availability near local peaks, and stronger or more constraining
  epistasis as backgrounds approach a peak?'
pre_experiment_prediction: Across seeds and conditioned or unconditioned synthetic
  family backgrounds, adaptive walks should gain fitness early and then decelerate;
  starting closer to the stored local peak should reduce beneficial fraction and mean
  beneficial effect size; peak-proximal neighborhoods should show larger or more sign-constraining
  pairwise epistasis than low-fitness neighborhoods.
rationale: HYP-004 is a biological-realism test, not a machine-learning benchmark.
  The experiment compares synthetic walk and epistasis behaviour to qualitative expectations
  from empirical fitness-landscape, microbial-adaptation, and Fisher-geometric-model
  literature before any optimizer ranking is considered.
