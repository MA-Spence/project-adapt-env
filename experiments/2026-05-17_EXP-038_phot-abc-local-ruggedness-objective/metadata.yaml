  - EXP-037
  motivating_results:
  - RES-036
  - RES-037
question: For PHOT, does adding adjacent-edge Dirichlet-energy localization statistics
  to the SMC-ABC calibration objective yield coupled-family candidates whose held-out
  graphlet fit and ruggedness diffuseness match empirical PHOT better than current/smooth,
  no-module, random/shuffled-module, and uncoupled controls?
pre_experiment_prediction: If the RUN-093 diagnosis is actionable, including adjacent-edge
  Dirichlet-energy autocorrelation and edge/site concentration terms in the ABC objective
  should select particles that better match empirical PHOT held-out ruggedness localization
  without losing the RUN-091 held-out graphlet-distance gain. Support for HYP-008
  still requires empirical-module specificity over no-module, random/shuffled-module,
  uncoupled-module, residual, and GNK controls.
rationale: RUN-091 showed ABC can improve PHOT held-out graphlet distance but failed
  locality specificity, while RUN-093 showed PHOT has residual localized ruggedness
  that was not optimized during ABC fitting. This experiment keeps the same PHOT base
  and candidate/control families, but adds explicit local ruggedness diffuseness statistics
  to the calibration objective.
