question: Can an oracle additive latent score plus flexible monotone global-epistasis
  nonlinearity outperform the mechanistic PHOT variants, thereby implicating restrictive
  AdaptEnv latent priors rather than measurement noise or scalar-assay non-identifiability?
pre_experiment_prediction: If AdaptEnv's latent priors are too restrictive, a MAVE-NN/MoCHI-style
  additive latent score with flexible monotone global epistasis should beat the mechanistic
  variants on held-out single mutants, double mutants, and epistasis prediction. If
  it does not, the dominant limitation is more likely measurement noise or insufficient
  identifiability from the scalar PHOT assay.
rationale: The oracle baseline separates mechanistic misspecification from assay information
  limits. It gives the data a flexible additive-to-observed map without requiring
  the AdaptEnv stability/activity priors to be correct.
