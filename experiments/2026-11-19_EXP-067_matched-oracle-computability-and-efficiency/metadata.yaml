question: At fixed landscape capabilities and declared query workloads, does the maintained
  factorized oracle offer a reproducible time or memory advantage over exact local
  tables and conventional bounded-neighbourhood GNK representations?
pre_experiment_prediction: Factorization will reduce resident memory relative to exact
  local tables; warm lookup may be faster, and a stateless conventional GNK oracle
  may remove the storage advantage. No universal speed or asymptotic advantage is
  predicted at fixed local complexity.
rationale: Separate representation effects on an identical fitness map from practical
  comparisons between different GNK ensembles. Express complexity in total potential
  sequences n=q^L and distinguish the Q sequences actually queried.
