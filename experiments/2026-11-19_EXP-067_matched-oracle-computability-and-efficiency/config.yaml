  C:
    name: conventional_gnk_tables
    same_map_as: D
    local_entry_distribution: counter-based pseudonormal
    normalization: ensemble-expected
    table_fill: batched counters, bounded scratch
  D:
    name: counter_gnk
    same_map_as: C
    local_entry_cache: false
    normalization: ensemble-expected
    current_sequence_index_value_cache_allowed: true
