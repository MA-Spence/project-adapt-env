question: Does replacing the forced stability-gate times readout-capacity collapse
  with a flexible monotone two-latent readout surface improve PHOT_CHLRE recovery?
pre_experiment_prediction: If the structural mismatch is mainly the imposed product/gate
  readout, then a constrained monotone readout over stability and readout-trait scores
  should improve held-out ranking and epistasis prediction without requiring a near-peak
  reference solution.
rationale: RES-010 tested the explicit two-trait implementation but forced the public
  scalar to stability_gate * trait:readout:capacity. RES-011 suggests stability alone
  is a strong predictive surrogate. This experiment isolates whether the failure is
  the hard-coded nonlinear collapse rather than the existence of two latent traits.
