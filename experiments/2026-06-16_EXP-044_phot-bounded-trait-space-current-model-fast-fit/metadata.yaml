question: Does a minimal bounded trait-space epistasis route in the current AdaptEnv
  model, fitted by a numerical fast fitter, produce PHOT graphlet accessibility, epistasis,
  spectral, and local-energy summaries comparable to empirical PHOT and the previously
  computed full-ABC PHOT comparator?
pre_experiment_prediction: Bounding epistatic perturbations before they enter stability
  should reduce the gross epistasis-amplitude pathology seen in residual min-coupled
  fits; success still requires held-out accessibility, sign/reciprocal/magnitude epistasis,
  diminishing returns, graphlet spectra, and local-energy concentration to fall near
  empirical PHOT and not materially worse than the full-ABC comparator.
rationale: 'EXP-042/EXP-043 showed that cheaper fitting of the nested residual-min
  family did not rescue PHOT component failures, suggesting the failure is in the
  model route rather than only in optimizer cost. This experiment tests the smallest
  model-level correction: keep current AdaptEnv structure, but bound epistatic signals
  in trait space before the readout, then fit by deterministic/random numerical search
  rather than broad ABC.'
