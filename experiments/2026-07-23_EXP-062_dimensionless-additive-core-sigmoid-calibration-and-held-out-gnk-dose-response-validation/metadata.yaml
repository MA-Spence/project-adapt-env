  aims:
  - AIM-001
  hypotheses:
  - HYP-005
  previous_experiments:
  - EXP-061
  motivating_results:
  - RES-058
  - RES-059
question: Can a globally frozen mutation-unit calibration of additive-core scale and
  sigmoid operating point restore a nonlinear, plateau-forming, monotone, length-stable
  real-core GNK dose response on held-out proteins?
pre_experiment_prediction: A core mutation displacement near two to three sigmoid
  logits and a reference occupancy of 0.95 to 0.99 will retain high and low plateaus
  while restoring practical actual-core GNK transmission; the raw margin-8 configuration
  will remain saturated.
rationale: RES-059 localizes the failure to the roughly 55-logit additive mutation
  scale and margin-8 operating point, while confirming that the normalized GNK field
  and sigmoid transfer work separately. A core-only calibration followed by outcome-blind
  held-out confirmation distinguishes a genuine nonlinear repair from trivial readout
  linearization.
