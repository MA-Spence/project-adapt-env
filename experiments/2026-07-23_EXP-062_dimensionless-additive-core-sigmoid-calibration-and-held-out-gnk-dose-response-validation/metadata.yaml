id: EXP-062
type: experiment
title: Dimensionless additive-core sigmoid calibration and held-out GNK dose-response
  validation
slug: dimensionless-additive-core-sigmoid-calibration-and-held-out-gnk-dose-response-validation
status: completed
created: '2026-07-23T12:07:49+10:00'
owner: matthew-spence
