catalog_version: 1
selection_frozen_before_model_scoring: true
scope_note: >-
  Real protein sequences are used only as fixed sequence contexts. No empirical
  fitness, abundance, expression, melting-temperature, or assay outcome enters
  calibration or confirmation. This is a fixed-panel mechanistic experiment,
  not population-level protein generalization.
long_strata_selection_note: >-
  The exact-length alternatives are an outcome-blind curated fixed panel, not a
  probability sample or a postulated representative sample of proteins. Exact
  identifiers and hashes make the tested panel reproducible; conclusions must
  remain conditional on it. Only the short confirmation pair uses a ranked
  candidate-universe rule, recorded below.
short_bin_note: >-
  The source panel contained no valid independent exact-length-48 Meltome
  sequence, so the preregistered short stratum spans lengths 47--52.
short_confirmation_selection:
  source_dataset: flip_meltome_stability_summary
  candidate_universe: 25 unique nonempty canonical-q20 sequences of length 47--52
  sequence_deduplication: retain the lexicographically smallest protein_id for each unique sequence
  outcome_fields_used: false
  rank_key: sha256("EXP-062-short-confirmation-v1|" + protein_id + "|" + sequence_sha256)
  rule: take ranks 1 and 2 before any model score

