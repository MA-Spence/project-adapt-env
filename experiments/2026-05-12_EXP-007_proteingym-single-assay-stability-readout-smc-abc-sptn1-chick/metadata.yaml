question: Does fitting the SPTN1_CHICK_Tsuboyama_2023_1TUD stability assay through
  a stability-targeted synthetic readout, instead of collapsed synthetic fitness,
  improve empirical recovery under the same single-assay SMC-ABC workflow?
pre_experiment_prediction: If the main remaining misspecification is that Adapt-Env
  collapses stability assays into a generic scalar fitness too early, then a stability-targeted
  readout with pairwise overrides routed through latent stability should improve single-mutant
  holdout, double-mutant holdout, and epistasis-prediction metrics relative to the
  RUN-022 controls on the same assay.
rationale: RES-006 showed that removing cross-assay pooling helps but does not rescue
  the SPTN1 single-assay fit. Code review and local diagnostics now indicate that
  the current calibration path explains this stability assay mainly through a near-binary
  folding gate applied to collapsed synthetic fitness, while the functional layer
  is nearly flat in the wild-type neighborhood. This experiment keeps the exact SPTN1
  assay and baseline controls from EXP-006, but adds stability-readout calibration
  branches that expose latent stability to the observation model and move empirical
  pairwise structure upstream of the nonlinear gate.
