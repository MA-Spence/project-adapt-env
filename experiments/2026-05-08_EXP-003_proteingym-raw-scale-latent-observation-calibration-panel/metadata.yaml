id: EXP-003
type: experiment
title: ProteinGym Raw-Scale Latent Observation Calibration Panel
slug: proteingym-raw-scale-latent-observation-calibration-panel
status: planned
created: '2026-05-08T13:18:26+10:00'
owner: matthew-spence
scientific_context:
  aims:
  - AIM-001
  hypotheses:
  - HYP-001
  previous_experiments:
  - EXP-001
  - EXP-002
  motivating_results:
  - RES-001
  - RES-002
question: Does HYP-001 hold more cleanly when assay-coordinate confounds are removed
  by fitting homogeneous multi-mutant ProteinGym stability assays on raw scores, using
  assay-specific latent observation models and non-affine measurement transforms instead
  of assay-wise z-scoring and wild-type zeroing?
pre_experiment_prediction: Within a homogeneous multi-mutant stability panel, a shared
  Adapt-Env regime fit on raw scores with assay-specific nonlinear observation models
  and on MAVE-NN-derived latent phenotypes should outperform the original z-scored
  baseline from EXP-001, while per-assay latent fits should still exceed the shared
  fit and thereby reveal the remaining gap attributable to true cross-protein heterogeneity.
rationale: 'RES-001 weakened HYP-001, but that run mixed assay families, z-scored
  each assay, fixed wild type to zero, and excluded double-mutant signal from calibration.
  RES-002 then showed that the raw Adapt-Env family is expressive enough to span broad
  local DFE regimes. This experiment is therefore run to isolate a more specific question:
  whether the main failure in RES-001 came from coordinate-system and observation-model
  mismatch rather than from lack of landscape expressivity. It does so by using a
  homogeneous ProteinGym stability subpanel with real multi-mutant measurements, learning
  assay-specific latent observation maps from raw scores, and comparing shared versus
  per-assay Adapt-Env calibration on those cleaner coordinates.'
