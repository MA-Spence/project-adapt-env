notes:
- This experiment is run because RES-001 confounded external-realism failure with
  assay-coordinate and observation-model mismatch, while RES-002 showed that the
  model family itself is broad enough to remain scientifically live under HYP-001.
- The current implementation uses mavenn to estimate assay-specific raw-scale and
  latent wild-type anchors instead of standardizing each assay and forcing wild
  type to zero.
