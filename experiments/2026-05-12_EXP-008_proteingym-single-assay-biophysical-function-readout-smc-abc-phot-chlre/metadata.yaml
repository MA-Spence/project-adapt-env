question: Does replacing collapsed synthetic fitness with an explicit stability-plus-function
  biophysical readout improve empirical recovery for the multi-mutant PHOT_CHLRE_Chen_2023
  functional assay under the same single-assay SMC-ABC workflow used in the most recent
  stability round?
pre_experiment_prediction: If the misspecification exposed by RUN-024 extends beyond
  unfolding assays, then a functional assay fit through an explicit stability-plus-function
  readout, with empirical pairwise overrides routed through the function layer, should
  improve single-mutant holdout, double-mutant holdout, and epistasis-prediction metrics
  relative to the paired raw-fitness controls on the same assay.
rationale: RUN-024 showed that the recent single-assay improvement came from exposing
  the right latent variable to calibration rather than from changing the optimizer
  alone. HYP-007 makes the stronger claim that functional assays should not be fit
  through the same collapsed scalar used for viability-style readouts. This experiment
  therefore keeps the exact single-assay Bayesian workflow, control branches, and
  resource profile from EXP-007, but moves to one activity assay with substantial
  multi-mutant coverage and adds calibration branches that treat assay signal as a
  stability-plus-function biophysical readout instead of collapsed synthetic fitness.
