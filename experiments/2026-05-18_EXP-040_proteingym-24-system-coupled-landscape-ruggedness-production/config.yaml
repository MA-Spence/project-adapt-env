experiment_id: EXP-040
title: ProteinGym 24-system coupled landscape ruggedness production
stack: STACK-000
target: lab-slurm

experiment:
  id: EXP-040
  status: planned
  mode: multi_system_base_plus_aligned_coupled_landscape_production
  planned_runner: scripts/proteingym_multi_system_coupled_landscape_production.py
  scientific_boundary:
    primary_hypotheses:
      - HYP-004
      - HYP-009
    motivating_claims:
      - CLAIM-001
      - CLAIM-003
    motivating_results:
      - RES-013
      - RES-030
      - RES-036
      - RES-038
      - RES-039
    interpretation_rule: >
      Coupled and three-way terms are interpreted as bulk ruggedness capacity
      routed through alignment-legible modules. They are not interpreted as
      recovered residue-specific interaction terms.
    empirical_target_rule: >
      Primary empirical topology is measured on the MAVE-NN latent_phi layer
      when available, because graphlet and WHT/GFT comparisons require a
      smooth empirical model over dense local subgraphs.

proteingym:
  version: v1.3
  reference_csv_url: https://raw.githubusercontent.com/OATML-Markslab/ProteinGym/main/reference_files/DMS_substitutions.csv
  substitutions_parquet_url: https://proteingym.s3.us-east-2.amazonaws.com/DMS_substitutions.parquet
  reference_csv_path: data/raw/proteingym/v1.3/reference/DMS_substitutions.csv
  substitutions_parquet_path: data/raw/proteingym/v1.3/DMS_substitutions.parquet
  assay_output_dir: data/raw/proteingym/v1.3/assays

panel_design:
  expected_system_count: 24
  require_multiple_mutants: true
  max_tsuboyama_systems: 10
  required_assays:
    - PHOT_CHLRE_Chen_2023
  selection_criteria:
    - include only ProteinGym substitution assays with multiple-mutant coverage
    - require assays suitable for at least single/double holdout diagnostics, accepting PHOT-like high-order assays with sparse doubles when dense higher-order coverage is strong
    - span activity, binding, expression, organismal-fitness, and stability readouts
    - cap Tsuboyama stability assays at 10 of 24 systems
    - include paired or related systems where they test different readout layers, but treat each assay as a separate system-specific calibration target

systems:
  - assay_id: PHOT_CHLRE_Chen_2023
    role: activity_high_order_anchor
    rationale: PHOT-like activity assay with extensive combinatorial coverage and prior project graphlet evidence.
  - assay_id: GFP_AEQVI_Sarkisyan_2016
    role: fluorescent_activity_high_order
    rationale: GFP FACS activity landscape with many double and higher-order mutants.
  - assay_id: Q8WTC7_9CNID_Somermeyer_2022
    role: fluorescent_activity_homolog_high_order
    rationale: GFP-family homolog activity assay with high-order combinatorial coverage.
  - assay_id: Q6WV12_9MAXI_Somermeyer_2022
    role: fluorescent_activity_homolog_high_order
    rationale: GFP-family homolog activity assay with high-order combinatorial coverage.
  - assay_id: D7PM05_CLYGR_Somermeyer_2022
    role: fluorescent_activity_homolog_high_order
    rationale: GFP-family homolog activity assay with high-order combinatorial coverage.
  - assay_id: SPG1_STRSG_Olson_2014
    role: binding_dense_double_mutant
    rationale: Very dense double-mutant binding assay, useful for pairwise and graphlet controls.
  - assay_id: SPG1_STRSG_Wu_2016
    role: binding_high_order
    rationale: Same broad system class as Olson with substantial higher-order combinatorial mutants.
  - assay_id: RASK_HUMAN_Weng_2022_abundance
    role: human_expression_dense_double_mutant
    rationale: Human KRAS abundance readout with dense double-mutant coverage.
  - assay_id: RASK_HUMAN_Weng_2022_binding-DARPin_K55
    role: human_binding_dense_double_mutant
    rationale: Matched KRAS binding readout with dense double-mutant coverage.
  - assay_id: GRB2_HUMAN_Faure_2021
    role: human_growth_dense_double_mutant
    rationale: Human signaling protein growth/organismal-fitness assay with dense double-mutant coverage.
  - assay_id: HIS7_YEAST_Pokusaeva_2019
    role: yeast_growth_high_order
    rationale: Yeast growth assay with very high combinatorial coverage beyond doubles.
  - assay_id: F7YBW8_MESOW_Aakre_2015
    role: prokaryote_antitoxin_high_order
    rationale: Protein interaction/organismal-fitness assay with combinatorial mutants.
  - assay_id: F7YBW8_MESOW_Ding_2023
    role: prokaryote_design_high_order
    rationale: Related Mesorhizobium system with high-order mutants and a distinct experiment.
  - assay_id: GCN4_YEAST_Staller_2018
    role: yeast_binding_high_order
    rationale: Transcription-factor binding assay with higher-order mutant coverage.
  - assay_id: HECD1_HUMAN_Tsuboyama_2023_3DKM
    role: stability_tsuboyama_human_dense_double
    rationale: High-coverage human stability control from Tsuboyama, retained but capped.
  - assay_id: POLG_PESV_Tsuboyama_2023_2MXD
    role: stability_tsuboyama_viral_dense_double
    rationale: Viral stability control with dense double-mutant coverage.
  - assay_id: UBE4B_HUMAN_Tsuboyama_2023_3L1X
    role: stability_tsuboyama_human_dense_double
    rationale: Human stability control with dense double-mutant coverage.
  - assay_id: MYO3_YEAST_Tsuboyama_2023_2BTT
    role: stability_tsuboyama_eukaryote_dense_double
    rationale: Yeast stability control used in earlier shared-panel fits.
  - assay_id: AMFR_HUMAN_Tsuboyama_2023_4G3O
    role: stability_tsuboyama_human_dense_double
    rationale: Compact human stability system with strong double-mutant coverage.
  - assay_id: SPTN1_CHICK_Tsuboyama_2023_1TUD
    role: stability_tsuboyama_eukaryote_prior_positive_control
    rationale: Prior project positive-control stability system.
  - assay_id: CSN4_MOUSE_Tsuboyama_2023_1UFM
    role: stability_tsuboyama_eukaryote_dense_double
    rationale: Eukaryotic stability system used in earlier shared-panel fits.
  - assay_id: SDA_BACSU_Tsuboyama_2023_1PV0
    role: stability_tsuboyama_prokaryote_dense_double
    rationale: Prokaryotic stability control used in earlier shared-panel fits.
  - assay_id: RCRO_LAMBD_Tsuboyama_2023_1ORC
    role: stability_tsuboyama_viral_double
    rationale: Viral stability system, extending taxonomic coverage.
  - assay_id: SPA_STAAU_Tsuboyama_2023_1LP1
    role: stability_tsuboyama_prokaryote_double
    rationale: Prokaryotic stability system with more than 1000 double mutants.

panel:
  panel_size: 1
  assays_per_taxon: 0
  allowed_taxa: []
  coarse_selection_type: null
  selection_type: null
  require_multiple_mutants: true
  min_single_mutants: 30
  min_multiple_mutants: 50
  max_sequence_length: 500
  assay_ids: []

mmseqs:
  alignment_dir: data/interim/proteingym_mmseqs_alignments
  cache_dir: data/interim/proteingym_mmseqs_cache
  max_alignment_sequences: 512
  timeout_seconds: 20.0
  poll_interval_seconds: 5.0
  max_retries: 6

mavenn:
  alphabet: protein
  regression_type: GE
  gpmap_type: additive
  ge_nonlinearity_type: nonlinear
  ge_nonlinearity_monotonic: true
  ge_noise_model_type: SkewedT
  ge_heteroskedasticity_order: 2
  theta_regularization: 0.0001
  eta_regularization: 0.0001
  max_mutation_count: 3
  max_variants_per_assay: 12000
  sample_seed: 17
  test_holdout_modulo: 10
  test_holdout_remainder: 0
  report_information_metrics: false
  validation_fraction: 0.1
  epochs: 60
  learning_rate: 0.005
  early_stopping_patience: 8
  batch_size: 256

adapt_env:
  base_config:
    observed_fitness_combine_mode: stability_margin
    stability_margin: 8.0
    stability_scale: 1.0
    stability_conservation_power: 1.0
    threshold_steepness: 20.0
    fitness_output_scale: 10.0
    generic_epistasis_target: stability
    n_epistatic_terms: 220
    epistasis_strength: 0.025
    empirical_pairwise_strength: 0.025
    pairwise_epistasis_rank: 2
    epistasis_covariation_bias: 0.8
    n_higher_order_epistatic_terms: 0
    noise_amplitude: 0.0
    noise_heterogeneity: 0.0
    peak_search_steps: 400
    peak_search_top_single_starts: 8
    peak_search_random_starts: 8
    peak_search_random_radius: 2
    peak_distance_from_consensus: 0
    use_blosum_kernel: true
    blosum_blend: 0.5
    seed: 42

calibration_max_mutation_count: 3
deterministic_branches: {}
synthetic_truth_recovery:
  enabled: false

base_abc:
  distance_mode: validation_objective
  backend:
    kind: ray
    max_workers: 8
    batch_size: 8
  selected_features:
    - mean
    - variance
    - skewness
    - fraction_neutral
    - fraction_beneficial
    - fraction_deleterious
    - fraction_lethal
    - conservation_correlation
    - epistasis_variance
  bootstrap_replicates: 128
  covariance_shrinkage: 0.35
  covariance_ridge: 1.0e-6
  replicates_per_particle: 1
  calibration:
    neutral_threshold: 0.25
    beneficial_threshold: 0.25
    lethal_relative_threshold: 0.1
    max_landscapes_per_fit: 1
    max_observed_sequences: 8192
    max_double_mutants: 8192
    synthetic_seed: 1357
    query_missing_alignments: false
    single_mutant_holdout_modulo: 5
    single_mutant_holdout_remainder: 0
    double_mutant_holdout_modulo: 5
    double_mutant_holdout_remainder: 0
    double_mutant_holdout_scheme: pair
    synthetic_readout_mode: stability_margin
    empirical_pairwise_target: stability
    observation_model_kind: auto
    observation_model_max_knots: 12
    observation_model_min_bin_size: 16
    empirical_pairwise_model: regularized_low_rank
    empirical_pairwise_max_pairs: 0
    empirical_pairwise_rank: 4
    empirical_pairwise_prior_strength: 1.0
    empirical_pairwise_shared_template_weight: 0.0
    empirical_pairwise_observed_prior_blend: 0.0
    empirical_pairwise_coverage_shrink_power: 0.0
    empirical_pairwise_normalization: none
    functional_core_objective: dfe_objective
    functional_fit_strategy: iterative
    functional_joint_rounds: 3
    dfe_predictive_holdout_weight: 5.0
    dfe_predictive_rank_weight: 3.0
    dfe_double_predictive_weight: 1.5
    reference_peak_fraction_max: 0.85
    reference_peak_fraction_weight: 1.0
    reference_peak_distance_min: 1
    reference_peak_distance_weight: 0.5
  parameters:
    - name: stability_scale
      kind: float
      low: 0.5
      high: 1.5
    - name: stability_margin
      kind: float
      low: 4.0
      high: 14.0
    - name: threshold_steepness
      kind: float
      low: 8.0
      high: 40.0
    - name: blosum_blend
      kind: float
      low: 0.2
      high: 0.8
    - name: stability_conservation_power
      kind: float
      low: 0.75
      high: 1.35
    - name: n_epistatic_terms
      kind: int
      low: 0
      high: 420
    - name: epistasis_strength
      kind: float
      low: 0.0
      high: 0.10
    - name: empirical_pairwise_strength
      kind: float
      low: 0.0
      high: 0.10
    - name: pairwise_epistasis_rank
      kind: int
      low: 1
      high: 6
  smc:
    n_particles: 48
    n_rounds: 3
    initial_pool_multiplier: 5
    proposal_pool_multiplier: 6
    epsilon_quantile: 0.6
    seed: 20260518

graphlets:
  primary_score_column: latent_phi
  score_columns:
    - latent_phi
  dimensions:
    - 2
    - 3
    - 4
    - 5
    - 6
  max_graphlets_per_dimension: 6
  top_feature_pool: 38
  max_combinations_per_dimension: 150000
  dfe_neutral_threshold: 0.05
  metric_columns:
    - sign_epistasis_fraction
    - reciprocal_sign_epistasis_fraction
    - magnitude_epistasis_mean
    - n_local_maxima
    - accessible_path_fraction
    - random_walk_lag1_autocorrelation
    - walsh_high_order_fraction
    - gft_low_energy_fraction
    - gft_mid_energy_fraction
    - gft_high_energy_fraction
    - dfe_fraction_beneficial
    - dfe_fraction_deleterious
    - dfe_fraction_neutral
    - edge_energy_adjacent_moran_i
    - edge_energy_top10_fraction
    - edge_energy_effective_fraction
    - site_energy_top1_fraction
    - site_energy_effective_fraction
    - plaquette_energy_top1_fraction
    - plaquette_energy_effective_fraction

variant_validation:
  empirical_score_column: latent_phi
  holdout_modulo: 5
  holdout_remainder: 0
  max_single_variants: 2500
  max_double_variants: 12000
  max_triple_variants: 12000
  max_high_order_variants: 12000
  evaluation_batch_size: 4096

coupled_fit:
  alignment_modules:
    max_pairs: 240
    max_triplets: 300
  coupled_2way:
    resume_checkpoints: true
    graphlet_distance_weight: 1.0
    variant_rank_weight: 0.35
    base_correlation_min: 0.45
    base_correlation_penalty_weight: 2.0
    smc:
      n_particles: 32
      n_rounds: 3
      initial_pool_multiplier: 4
      proposal_pool_multiplier: 4
      epsilon_quantile: 0.6
      seed: 20260518
    backend:
      kind: serial
      max_workers: 1
      batch_size: 1
    parameters:
      - name: base_rescale
        kind: float
        low: 0.65
        high: 1.25
        initial_scale_fraction: 0.18
        min_scale_fraction: 0.05
      - name: alignment_pair_scale
        kind: float
        low: -1.20
        high: 1.20
        initial_scale_fraction: 0.18
        min_scale_fraction: 0.05
  coupled_3way:
    resume_checkpoints: true
    graphlet_distance_weight: 1.0
    variant_rank_weight: 0.35
    base_correlation_min: 0.35
    base_correlation_penalty_weight: 2.0
    smc:
      n_particles: 32
      n_rounds: 3
      initial_pool_multiplier: 4
      proposal_pool_multiplier: 4
      epsilon_quantile: 0.6
      seed: 20260519
    backend:
      kind: serial
      max_workers: 1
      batch_size: 1
    parameters:
      - name: base_rescale
        kind: float
        low: 0.55
        high: 1.25
        initial_scale_fraction: 0.18
        min_scale_fraction: 0.05
      - name: alignment_pair_scale
        kind: float
        low: -1.20
        high: 1.20
        initial_scale_fraction: 0.18
        min_scale_fraction: 0.05
      - name: alignment_triplet_scale
        kind: float
        low: -0.90
        high: 0.90
        initial_scale_fraction: 0.18
        min_scale_fraction: 0.05

walks:
  max_graphlets_per_system: 8
  n_random_walks_per_graphlet: 12
  n_adaptive_walks_per_graphlet: 12
  steps: 32

analysis:
  random_walk:
    n_walks_per_graphlet: 20
    steps: 32
    lag_max: 5

resume:
  reuse_completed_systems: true
  reuse_completed_base_fits: true
  source_run_id: RUN-104
  rationale: >
    Each system writes base_fit/checkpoints/smc_empirical.json plus coupled
    checkpoints under systems/<assay>/checkpoints. If Slurm times out or a run
    fails after partial progress, a later submission can seed from source_run_id,
    reuse completed systems, and continue incomplete SMC pools.

outputs:
  output_dir_name: proteingym-24-system-coupled-landscape-ruggedness-production
  expected_files:
