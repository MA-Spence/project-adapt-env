question: Across a diverse 24-system ProteinGym multi-mutant panel, do base thermodynamic
  residual-epistasis, aligned two-way coupled, and aligned three-way coupled landscape
  fits reproduce empirical predictive and topological ruggedness behaviour on held-out
  variants and graphlets?
pre_experiment_prediction: The base thermodynamic residual model should recover coarse
  single/double-mutant predictive structure in some systems but underfit high-order
  and local ruggedness summaries; aligned coupled capacity should improve bulk graphlet,
  DFE, walk, and spectral statistics while preserving correlation to the base function;
  three-way coupling may add capacity but should not be interpreted as residue-specific
  mechanism.
rationale: CLAIM-001 and CLAIM-003 support system-specific thermodynamic calibration
  and coupled auxiliary capacity, but almost all coupled-landscape evidence is PHOT-only.
  A production multi-system experiment is needed to certify whether the same model
  hierarchy improves empirical-like landscape topology across activity, binding, expression,
  organismal-fitness, and stability assays with real combinatorial mutation coverage.
