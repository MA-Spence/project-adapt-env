experiment_id: EXP-002
title: Uncalibrated DFE Grid Scan for Single and Double Mutants
stack: STACK-000
target: lab-slurm
experiment:
  id: EXP-002

landscape:
  sequence_length: 80
  conditioned: false

adapt_env:
  base_config:
    stability_margin: 8.0
    stability_scale: 1.0
    stability_conservation_power: 1.0
    threshold_steepness: 20.0
    n_functional_dims: 4
    functional_sigma_base: 20.0
    functional_sigma_anisotropy: 0.35
    functional_weight: 1.0
    fitness_output_scale: 10.0
    n_epistatic_terms: 220
    epistasis_strength: 0.03
    empirical_pairwise_strength: null
    pairwise_epistasis_rank: 2
    epistasis_order_max: 3
    epistasis_order_decay: 2.0
    n_higher_order_epistatic_terms: 0
    epistasis_covariation_bias: 0.8
    noise_amplitude: 0.0
    noise_heterogeneity: 0.0
    peak_search_steps: 400
    peak_search_top_single_starts: 8
    peak_search_random_starts: 8
    peak_search_random_radius: 2
    peak_distance_from_consensus: 3
    use_blosum_kernel: true
    blosum_blend: 0.5

grid:
  stability_margin: [5.0, 8.0, 12.0]
  functional_sigma_base: [12.0, 20.0, 28.0]
  n_functional_dims: [2, 4, 8]
  epistasis_strength: [0.0, 0.03, 0.06]

sampling:
  seeds: [101, 202, 303, 404]
  double_mutants_per_landscape: 10000
  batch_size: 4096
  neutral_threshold_min: 0.02
  neutral_threshold_fraction_of_parent: 0.05

quick:
  landscape:
    sequence_length: 36
  grid:
    stability_margin: [5.0, 8.0]
    functional_sigma_base: [12.0]
    n_functional_dims: [2, 4]
    epistasis_strength: [0.0, 0.03]
  sampling:
    seeds: [101]
    double_mutants_per_landscape: 512
    batch_size: 512
