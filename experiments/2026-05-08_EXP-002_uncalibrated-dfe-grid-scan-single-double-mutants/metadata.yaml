id: EXP-002
type: experiment
title: Uncalibrated DFE Grid Scan for Single and Double Mutants
slug: uncalibrated-dfe-grid-scan-single-double-mutants
status: planned
created: '2026-05-08T11:35:54+10:00'
owner: matthew-spence
scientific_context:
  aims:
  - AIM-001
  hypotheses:
  - HYP-001
  previous_experiments:
  - EXP-001
  motivating_results:
  - RES-001
question: Without fitting to any empirical DMS landscape, what single-mutant and double-mutant
  DFEs does the raw Adapt-Env model family generate across a preregistered parameter
  grid, and does that grid span qualitatively protein-like local mutational regimes?
pre_experiment_prediction: Across the uncalibrated grid, lower stability margins and
  higher epistasis strengths should shift one- and two-step DFEs toward more deleterious
  and lethal effects, double-mutant DFEs should be broader and more deleterious than
  single-mutant DFEs, and epistasis-sensitive settings should produce larger deviations
  from additive expectation for double mutants.
rationale: 'After RES-001 weakened HYP-001 under empirical calibration, the next rigorous
  question is whether the uncalibrated model family can generate a plausible envelope
  of one- and two-step DFEs at all. This does not directly test empirical recovery,
  but it is a necessary scope check: if the raw family cannot span realistic local
  DFE regimes before fitting, calibration failure is more likely a model-family limitation
  than only an objective-search problem.'
