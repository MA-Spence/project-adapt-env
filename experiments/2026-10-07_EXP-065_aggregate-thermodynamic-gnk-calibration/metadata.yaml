  while that hold remains.'
- '2026-11-19 preparation verification: 49 maintained package tests, 5 matched-run
  tests and 3 source/profile tests pass. Actual-input SMOKE_ONLY execution completed
  18 settings, two seeds, 183 graph rows and 12 latent graph rows in 40.81 seconds.
  All original 12 computational method ASTs match RUN-175; original numerical kernels
