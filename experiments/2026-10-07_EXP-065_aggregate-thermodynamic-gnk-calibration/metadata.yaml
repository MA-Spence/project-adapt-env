question: Can a mutation-normalized thermodynamic GNK generator recover joint aggregate
  statistics of measured complete subspaces on held-out cubes and fresh generator
  seeds?
pre_experiment_prediction: The composite will reduce held-out joint summary error
  relative to additive-only and bare-GNK baselines; remaining descriptor-specific
  errors will be reported without a routing-specific pass gate.
rationale: Use the supported rank-8 normalized field with corrected plateau, DFE,
  and WHT measurements to test conditional statistical recovery directly, without
  identifying empirical interactions.
