  runner/config hashes. RUN-165 is the nonexecuting submission preview.
- RUN-166 completed with exit code 0. ANA-064 collects and audits its full output/source
  bundle and provides an executed notebook with five PNG/PDF figures. The primary
  paired readout contrast is small and uncertain; local variation persists through
  length 512 while global statistical transfer remains conditional on sampling. No
  new RES or CLAIM was requested.
- 'Scientist authorized a new RUN after ANA-064: recover original TrpB replicates,
  retain the original empirical panel/activity strata, estimate differential noise
  and a stop-control shared-error sensitivity, and compare all eight frozen RUN-166
  model arms. Original processing shares input counts; shared error is therefore not
  identifiable from replicate disagreement alone. Eight numerical controls and the
  two-draw SMOKE_ONLY run pass; source/input provenance is preserved in a new DVC
  bundle.'
- RUN-168 attempt 1 was accepted as Slurm 2313 and verified RUNNING on dutch. All
  eight staged runner/protocol/config/test/input-pointer hashes match local source;
  production reports 128 observation draws and stderr is empty. RUN-167 is the nonexecuting
  preview. Shared inputs and all 16 DVC backup objects were hash-verified.
- RUN-168 completed with exit code 0 in 103.16 seconds. ANA-065 independently audits
  its observations and statistics and supplies an executed eight-cell notebook with
  five PNG/PDF figures. Replicate disagreement alone leaves the mean per-cube WHT
  discrepancy; shared-stop correction is unstable near the assay floor, and adding
  observation noise improves some descriptors while increasing spread. The output/log/source
  bundle is DVC-tracked and all 159 unique cache objects are backed up and hash-verified.
  No RES or CLAIM was created.
- Scientist authorized observation-aware calibration, queue execution, active monitoring
  and a figure-led notebook ANA on 2026-10-08. The aim is useful global empirical
  resemblance for an online ML environment, without numerical scientific gates or
  specific interaction fitting.
- RUN-170 attempt 1 failed during source packaging before sbatch; queue inspection
  confirmed no job. Narrowed source snapshot and resubmitted the same RUN as attempt
  2. Twelve numerical tests and the old-panel SMOKE_ONLY pipeline passed; all seven
  shared input checksums verified.
- RUN-170 attempt 2 completed as Slurm 2314 in 60.86 seconds, exit 0 and empty stderr.
  ANA-066 independently audits 114,432 statistic rows and 1,179,648 replayed observations,
  reproduces six fitted objectives and supplies eight executed notebook code cells
  with five inline PNG/PDF figures. The 215-file output/log/source bundle is DVC-tracked;
  all 208 unique objects are backed up and MD5-verified. Evidence supports candidate
  empirical-like ML regimes with explicit observation dependence and residual activity
  mismatch; no new RES/CLAIM or scientific gate.
- Scientist authorized one non-production follow-up RUN under EXP-065 on 2026-10-08,
  with queue monitoring through completion and a figure-led ANA. Six interaction strengths,
  16 paired original seeds and eight fresh seeds per assay, frozen calibration panels/noise
