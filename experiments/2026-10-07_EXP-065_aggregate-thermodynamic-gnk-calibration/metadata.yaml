- 'ANA-069 completes the figure-led analysis of RUN-175: eight executed notebook cells,
  five PNG/PDF figures, all 390 earlier graph anchors reproduced exactly, 24 objectives
  and 1,732 WHT summaries independently checked. DVC bundle and all 184 remote objects
  verified. Evidence supports useful conditional regimes, with amplitude, seed and
  observation limitations; no scientific acceptance gates applied.'
- '2026-11-19: Scientist authorized restoring the alignment-profile additive option
