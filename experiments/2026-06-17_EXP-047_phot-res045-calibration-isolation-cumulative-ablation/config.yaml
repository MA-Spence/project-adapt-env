experiment_id: EXP-047
title: PHOT RES-045 calibration isolation cumulative ablation
stack: STACK-000
target: lab-slurm

experiment:
  id: EXP-047
  status: planned
  mode: phot_res045_calibration_isolation_cumulative_ablation
  planned_runner: scripts/phot_trait_space_bounded_gate_fast_fit.py
  scientific_boundary:
    primary_hypotheses:
      - HYP-004
      - HYP-009
    motivating_results:
      - RES-045
    advisory_source: scratch/RES-045_epistasis_calibration_isolation_plan.md
    assay_scope: PHOT_CHLRE_Chen_2023 only
    fitting_rule: deterministic/random numerical fast fit plus a model-free k-trait capability probe
    stage_rule: run A, A+F, A+F+B, A+F+B+C, A+F+B+C+D, and A+F+B+C+D+E in one cumulative experiment
    comparator_rule: compare sequence-conditioned selected candidates against empirical PHOT graphlets and RUN-098 full-ABC PHOT distances
    limitation: PHOT-only calibration diagnostics do not validate a general GB1/TrpB-scale benchmark route

observation_calibration:
  enabled: true
  method: monotone_piecewise
  fit_split: calibration
  apply_to_objective: true
  apply_to_reporting: true
  max_knots: 16
  min_bin_size: 8
  interpretation: Keep the RES-045 stage-1 readout for A/AF so the first comparison isolates generator-scale anchoring.

source_run:
  run_id: RUN-077
  result_id: RES-030
  output_dir: data/processed/system-specific-current-model-refit-graphlet-falsifier-repeat/RUN-077
  dvc_pointer: data/processed/system-specific-current-model-refit-graphlet-falsifier-repeat/RUN-077.dvc
  assay_id: PHOT_CHLRE_Chen_2023
  use_policy: frozen_current_phot_base_prepared_assay_and_empirical_graphlets

abc_comparator:
  experiment_id: EXP-039
  run_id: RUN-098
  result_id: RES-039
  output_dir: data/processed/phot-nested-softmin-ensemble-capacity-diagnostic/RUN-098
  dvc_pointer: data/processed/phot-nested-softmin-ensemble-capacity-diagnostic/RUN-098.dvc
  role: previously computed full nested-min PHOT ABC comparator
  primary_comparator_file: selected_family_distances.csv

adapt_env:
  base_config:
    observed_fitness_combine_mode: stability_margin
    stability_margin: 8.0
    stability_scale: 1.0
    stability_conservation_power: 1.0
    threshold_steepness: 20.0
    fitness_output_scale: 10.0
    generic_epistasis_target: stability
    trait_space_epistasis_bound: null
    trait_space_epistasis_bound_mode: tanh
    n_epistatic_terms: 220
    epistasis_strength: 0.025
    empirical_pairwise_strength: 0.025
    pairwise_epistasis_rank: 2
    epistasis_covariation_bias: 0.8
    n_higher_order_epistatic_terms: 0
    noise_amplitude: 0.0
    noise_heterogeneity: 0.0
    peak_search_steps: 0
    peak_search_top_single_starts: 0
    peak_search_random_starts: 0
    peak_search_random_radius: 2
    peak_distance_from_consensus: 0
    use_blosum_kernel: true
    blosum_blend: 0.5
    seed: 42

phot_graphlets:
  dimensions:
    - 4
    - 5
    - 6
  max_graphlets_per_dimension: 8
  top_feature_pool: 42

graphlet_evaluation:
  primary_score_column: latent_phi
  score_columns:
    - latent_phi
  metric_columns:
    - sign_epistasis_fraction
    - reciprocal_sign_epistasis_fraction
    - n_local_maxima
    - accessible_path_fraction
    - random_walk_lag1_autocorrelation
    - walsh_high_order_fraction
    - gft_low_energy_fraction
    - gft_mid_energy_fraction
    - gft_high_energy_fraction
    - edge_energy_adjacent_moran_i
    - edge_energy_top10_fraction
    - edge_energy_effective_fraction
    - site_energy_top1_fraction
    - site_energy_effective_fraction
    - plaquette_energy_top1_fraction
    - plaquette_energy_effective_fraction
    - magnitude_epistasis_to_single_mutant_sd_ratio
    - single_mutant_effect_sd
    - magnitude_epistasis_mean
    - magnitude_epistasis_median
    - magnitude_epistasis_sd
    - signed_pairwise_epistasis_sd
    - signed_pairwise_epistasis_q10
    - signed_pairwise_epistasis_q90
    - sign_epistasis_fraction_local
    - reciprocal_sign_epistasis_fraction_local
    - diminishing_returns_epistasis_fraction

scale_invariant_geometry_metrics:
  - sign_epistasis_fraction
  - reciprocal_sign_epistasis_fraction
  - n_local_maxima
  - accessible_path_fraction
  - random_walk_lag1_autocorrelation
  - walsh_high_order_fraction
