question: Do the RES-045 calibration-isolation fixes, applied cumulatively, separate
  PHOT raw-scale, geometry, texture, sequence-map, and search failures enough to recover
  a navigable but rugged latent graphlet package?
pre_experiment_prediction: Anchoring raw latent scale and decoupling scale-invariant
  geometry should reduce the RES-045 distance inflation; if the remaining failure
  is texture, k-trait and hybrid residual stages should raise local maxima and Walsh
  high-order fraction while preserving accessibility; if the fast search was limiting,
  the expanded-search stage should improve selected candidates.
rationale: RES-045 showed that a two-trait soft-min latent moved raw accessibility
  for the first time but left raw scale hundreds-fold too large, too few local maxima,
  low Walsh high-order texture, weak sequence-to-trait rank alignment, and signs of
  search stagnation. This experiment implements the scratch RES-045 isolation plan
  as one cumulative PHOT-only diagnostic while retaining the RUN-077 source and RUN-098
  comparator.
