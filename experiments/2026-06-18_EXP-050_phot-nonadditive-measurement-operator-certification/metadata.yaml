question: Can non-additive MAVE-NN GP-map operators recover injected high-order and
  local-ruggedness spectra under the same dense complete-graphlet measurement path
  used for PHOT?
pre_experiment_prediction: Pairwise and black-box/GE GP-map profiles will recover
  injected high-order fraction, sign epistasis, local maxima, and accessibility substantially
  better than the additive operator, but residual smoothing may remain.
rationale: RES-048 showed strong additive-map smoothing and exposed that the prior
  PHOT target was not measured under a single certified operator. This WS-A experiment
  re-runs the round-trip certification with non-additive GP-map profiles before any
  empirical overlap or benchmark-region claim is attempted.
