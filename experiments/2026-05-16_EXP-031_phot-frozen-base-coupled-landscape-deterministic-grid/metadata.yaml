id: EXP-031
type: experiment
title: PHOT frozen-base coupled-landscape deterministic grid search
slug: phot-frozen-base-coupled-landscape-deterministic-grid
status: planned
created: '2026-05-16T21:13:08+10:00'
owner: Codex
scientific_context:
  aims:
  - AIM-001
  hypotheses:
  - HYP-008
  previous_experiments:
  - EXP-030
  motivating_results:
  - RES-030
question: With PHOT as the only empirical test system, can a frozen RES-030 current-model
  base plus a constrained correlated local auxiliary landscape improve held-out dense
  graphlet topology, spectra, and localized plaquette-energy structure without rerunning
  ABC?
pre_experiment_prediction: If HYP-008 is plausible, local-module coupled candidates
  should improve PHOT held-out graphlet distance relative to the frozen current base,
  smooth core, diffuse residual, uncoupled auxiliary, shuffled/random modules, and
  GNK controls while preserving base correlation and concentrating innovation plaquette
  energy in few modules. If improvements are matched by shuffled/random/uncoupled
  controls, or require diffuse innovation or base-correlation loss, the coupled-landscape
  mechanism is not supported.
rationale: RES-030 showed that PHOT system-specific current refitting partially rescues
  graphlet dynamics but leaves a high-order spectral-envelope mismatch and weak smooth-core
  separation. This experiment avoids another expensive ABC run by freezing the RES-030
  PHOT base and deterministically enumerating the coupled-landscape parameter space
  needed for a first HYP-008 machinery test.
