question: For PHOT, does ABC fitting of the same RUN-079 coupled candidate families
  produce a calibration-selected held-out graphlet improvement that is specific to
  empirical local modules rather than no-module, random/shuffled-module, or uncoupled
  controls?
pre_experiment_prediction: Support for HYP-008 requires the ABC-selected empirical-module
  family to beat fitted-current, smooth-core, no-module, random-module, shuffled-module,
  and uncoupled-module controls on held-out graphlet distance while satisfying component
  guardrails for WHT high-order fraction, local maxima, accessibility, lag-1 autocorrelation,
  SE/RSE, and GFT bands. If the RUN-089 diagnosis is correct, the fitted no-module
  or uncoupled controls will remain competitive and the empirical-module specificity
  claim will fail.
rationale: RUN-089 showed that the RUN-079 no-module PHOT graphlet-distance gain is
  stable against current and smooth controls but fails specificity because the uncoupled-module
  control is better. This experiment uses ABC, which previously improved calibration
  performance over deterministic grids, to fit the same family/control set directly
  under calibration graphlet objectives before evaluating held-out graphlets.
