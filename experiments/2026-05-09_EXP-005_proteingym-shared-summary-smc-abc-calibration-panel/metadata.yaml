question: Does a project-local shared SMC-ABC summary calibration recover the fixed
  six-assay ProteinGym stability panel more faithfully than the current deterministic
  Adapt-Env fitters?
pre_experiment_prediction: If the dominant bottleneck is calibration rather than model-family
  expressivity, then an SMC-ABC fit against a structured per-assay summary target
  should improve shared raw holdout behavior relative to EXP-004 and should recover
  known parameters in synthetic-truth tests without collapsing immediately to zero
  epistasis.
rationale: RES-002 kept the model family scientifically live, while RES-003 and RES-004
  showed that coordinate-aware preprocessing and deterministic objective redesign
  still leave the inverse problem weak. This experiment is run to replace the current
  coarse staged/grid fitting path with a project-local likelihood-free Bayesian calibration
  on the same six-assay ProteinGym stability panel, with synthetic-truth recovery
  built in before the empirical test.
