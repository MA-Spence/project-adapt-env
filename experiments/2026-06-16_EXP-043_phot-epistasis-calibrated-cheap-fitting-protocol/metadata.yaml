id: EXP-043
type: experiment
title: PHOT epistasis-calibrated cheap fitting protocol
slug: phot-epistasis-calibrated-cheap-fitting-protocol
status: completed
created: '2026-06-16T13:57:47+10:00'
owner: matthew-spence
