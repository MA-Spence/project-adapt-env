  motivating_results:
  - RES-039
  - RES-040
  - RES-041
question: Can a cheap PHOT nested-min fitting protocol with an explicit positive affine
  readout calibration and epistasis-amplitude objective remove the raw pairwise epistasis
  magnitude mismatch while preserving graphlet ruggedness, accessibility, and local-energy
  summaries?
pre_experiment_prediction: Adding a calibrated observable readout plus pairwise epistasis-amplitude
  summaries to the cheap fitting objective will reduce observable-scale epistasis
  mismatch relative to RUN-098/RUN-110 selected fitted families, but raw latent epistasis
  may remain large; success requires calibrated held-out epistasis amplitude, accessibility,
  graphlet distance, and RES-040 local-energy failures to remain within guardrails.
rationale: RES-041 showed that cheap protocols reproduce the selected full-ABC fitted-family
  PHOT result, but the full-ABC result itself has pairwise epistasis amplitudes tens
  to hundreds of units versus about 0.293 empirically. This experiment keeps the nested-min
  family fixed and tests whether cheap fitting with an explicit readout calibration
  and epistasis-amplitude targets can produce a usable observable landscape before
  scaling to complete GB1 and TrpB landscapes.
