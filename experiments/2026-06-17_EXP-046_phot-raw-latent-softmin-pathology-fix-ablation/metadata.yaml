id: EXP-046
type: experiment
title: PHOT raw-latent soft-min pathology fix ablation
slug: phot-raw-latent-softmin-pathology-fix-ablation
status: completed
created: '2026-06-17T06:28:47+10:00'
owner: matthew-spence
scientific_context:
  aims:
  - AIM-001
  hypotheses:
  - HYP-004
  - HYP-009
  previous_experiments:
  - EXP-045
  motivating_results:
  - RES-044
question: Do the three RES-044 path-forward fixes, phased in cumulatively, repair
  PHOT raw-latent accessibility and scale pathologies while retaining the working
  A/C/D observable calibration protocol?
pre_experiment_prediction: If the dominant failure is latent geometry, adding a low-dimensional
  soft-min latent should improve raw accessibility relative to EXP-045, raw-latent
  constraints should prevent collapse or explosion, and making raw accessibility first-class
  should isolate whether accessibility can be fitted without losing magnitude/ratio
  calibration.
rationale: RES-044 showed that A/C/D improved observable magnitude and ratio but left
  raw accessibility roughly an order of magnitude too low, with the monotone readout
  unable to repair topology. This experiment keeps the PHOT source graphlets, RUN-098
  comparator, and recent deterministic numerical fast-fit protocol fixed while cumulatively
  testing the three RES-044 path-forward points.
