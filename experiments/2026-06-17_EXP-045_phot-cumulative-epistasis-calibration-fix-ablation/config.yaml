          low: 0.0
          high: 0.04
        - name: empirical_pairwise_strength
          kind: float
          low: 0.0
          high: 0.05
        - name: epistasis_covariation_bias
          kind: float
          low: 0.0
          high: 1.0
        - name: pairwise_epistasis_rank
          kind: int
          low: 1
          high: 3
        - name: blosum_blend
          kind: float
          low: 0.0
          high: 1.0
        - name: trait_space_epistasis_bound
          kind: float
          low: 0.02
          high: 2.0
        - name: global_readout_midpoint
          kind: float
          low: -6.0
          high: 6.0
        - name: global_readout_slope
          kind: float
          low: 0.15
          high: 5.0
        - name: global_readout_weight
          kind: float
          low: 0.25
          high: 4.0
  - label: A+B+C
    fixes: A+B+C
    description: add explicit specific-epistasis/additive-scale ratio knob and score realized ratio
    bounded_trait_space_fast_fit:
      specific_epistasis_variance_ratio:
        strength_scale: 0.04
        reference_n_terms: 220
        max_strength: 0.06
        empirical_pairwise_multiplier: 1.0
      parameter_specs:
        - name: stability_margin
          kind: float
          low: 4.0
          high: 14.0
        - name: stability_scale
          kind: float
          low: 0.4
          high: 1.8
        - name: stability_conservation_power
          kind: float
          low: 0.3
          high: 1.5
        - name: threshold_steepness
          kind: float
          low: 2.0
          high: 30.0
        - name: n_epistatic_terms
          kind: int
          low: 0
          high: 360
        - name: specific_epistasis_variance_ratio
          kind: float
          low: 0.0
          high: 0.35
        - name: epistasis_covariation_bias
          kind: float
          low: 0.0
          high: 1.0
        - name: pairwise_epistasis_rank
          kind: int
          low: 1
          high: 3
        - name: blosum_blend
          kind: float
          low: 0.0
          high: 1.0
        - name: trait_space_epistasis_bound
          kind: float
          low: 0.02
          high: 2.0
        - name: global_readout_midpoint
          kind: float
          low: -6.0
          high: 6.0
        - name: global_readout_slope
          kind: float
          low: 0.15
          high: 5.0
        - name: global_readout_weight
          kind: float
          low: 0.25
          high: 4.0
    graphlet_evaluation:
      metric_columns:
        - sign_epistasis_fraction
        - reciprocal_sign_epistasis_fraction
        - n_local_maxima
        - accessible_path_fraction
        - random_walk_lag1_autocorrelation
        - walsh_high_order_fraction
        - gft_low_energy_fraction
        - gft_mid_energy_fraction
        - gft_high_energy_fraction
        - edge_energy_adjacent_moran_i
        - edge_energy_top10_fraction
        - edge_energy_effective_fraction
        - site_energy_top1_fraction
        - site_energy_effective_fraction
        - plaquette_energy_top1_fraction
        - plaquette_energy_effective_fraction
        - magnitude_epistasis_mean
        - magnitude_epistasis_median
        - magnitude_epistasis_sd
        - magnitude_epistasis_to_single_mutant_sd_ratio
        - single_mutant_effect_sd
        - signed_pairwise_epistasis_mean
        - sign_epistasis_fraction_local
        - reciprocal_sign_epistasis_fraction_local
        - diminishing_returns_epistasis_fraction
  - label: A+B+C+D
    fixes: A+B+C+D
    description: replace near-zero signed-mean conditioning with signed-epsilon distribution and scale-invariant epistasis objectives
    graphlet_evaluation:
      metric_columns:
