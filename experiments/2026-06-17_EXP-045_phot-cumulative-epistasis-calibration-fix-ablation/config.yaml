experiment_id: EXP-045
title: PHOT cumulative epistasis calibration fix ablation
stack: STACK-000
target: lab-slurm

experiment:
  id: EXP-045
  status: planned
  mode: phot_cumulative_epistasis_calibration_fix_ablation
  planned_runner: scripts/phot_trait_space_bounded_gate_fast_fit.py
  scientific_boundary:
    primary_hypotheses:
      - HYP-004
      - HYP-009
    motivating_results:
      - RES-040
      - RES-042
      - RES-043
    advisory_source: scratch/RES-043_epistasis_calibration_review.md
    assay_scope: PHOT_CHLRE_Chen_2023 only
    fitting_rule: deterministic/random numerical fast fit with cumulative model/objective fixes
    stage_rule: run A, then A+B, then A+B+C, then A+B+C+D in one experiment
    comparator_rule: compare selected candidates against empirical PHOT graphlets and RUN-098 full-ABC PHOT distances

observation_calibration:
  enabled: true
  method: monotone_piecewise
  fit_split: calibration
  apply_to_objective: true
  apply_to_reporting: true
  max_knots: 16
  min_bin_size: 8
  interpretation: Fix A; fitted monotone link replaces the positive-affine map so second and first finite differences are not constrained to share one scale factor

source_run:
  run_id: RUN-077
  result_id: RES-030
  output_dir: data/processed/system-specific-current-model-refit-graphlet-falsifier-repeat/RUN-077
  dvc_pointer: data/processed/system-specific-current-model-refit-graphlet-falsifier-repeat/RUN-077.dvc
  assay_id: PHOT_CHLRE_Chen_2023
  use_policy: frozen_current_phot_base_prepared_assay_and_empirical_graphlets

abc_comparator:
  experiment_id: EXP-039
  run_id: RUN-098
  result_id: RES-039
  output_dir: data/processed/phot-nested-softmin-ensemble-capacity-diagnostic/RUN-098
  dvc_pointer: data/processed/phot-nested-softmin-ensemble-capacity-diagnostic/RUN-098.dvc
  role: previously computed full nested-min PHOT ABC comparator
  primary_comparator_file: selected_family_distances.csv

adapt_env:
  base_config:
    observed_fitness_combine_mode: stability_margin
    stability_margin: 8.0
    stability_scale: 1.0
    stability_conservation_power: 1.0
    threshold_steepness: 20.0
    fitness_output_scale: 10.0
    generic_epistasis_target: stability
    trait_space_epistasis_bound: null
    trait_space_epistasis_bound_mode: tanh
    n_epistatic_terms: 220
    epistasis_strength: 0.025
    empirical_pairwise_strength: 0.025
    pairwise_epistasis_rank: 2
    epistasis_covariation_bias: 0.8
    n_higher_order_epistatic_terms: 0
    noise_amplitude: 0.0
    noise_heterogeneity: 0.0
    peak_search_steps: 0
    peak_search_top_single_starts: 0
    peak_search_random_starts: 0
    peak_search_random_radius: 2
    peak_distance_from_consensus: 0
    use_blosum_kernel: true
    blosum_blend: 0.5
    seed: 42

phot_graphlets:
  dimensions:
    - 4
    - 5
    - 6
  max_graphlets_per_dimension: 8
  top_feature_pool: 42

graphlet_evaluation:
  primary_score_column: latent_phi
  score_columns:
    - latent_phi
  metric_columns:
    - sign_epistasis_fraction
    - reciprocal_sign_epistasis_fraction
    - n_local_maxima
    - accessible_path_fraction
    - random_walk_lag1_autocorrelation
    - walsh_high_order_fraction
    - gft_low_energy_fraction
    - gft_mid_energy_fraction
    - gft_high_energy_fraction
    - edge_energy_adjacent_moran_i
    - edge_energy_top10_fraction
    - edge_energy_effective_fraction
    - site_energy_top1_fraction
    - site_energy_effective_fraction
    - plaquette_energy_top1_fraction
    - plaquette_energy_effective_fraction
    - magnitude_epistasis_mean
    - magnitude_epistasis_median
    - magnitude_epistasis_sd
    - signed_pairwise_epistasis_mean
    - sign_epistasis_fraction_local
    - reciprocal_sign_epistasis_fraction_local
    - diminishing_returns_epistasis_fraction

empirical_innovation:
  base_anchor: fitted_current_best
  global_readout_polynomial_degree: 3
  use_calibration_graphlets_only: true
  residual_definition: empirical_latent_phi_minus_polynomial_readout_of_frozen_current_best

module_selection:
  source: empirical_calibration_plaquette_energy
  max_modules: 12
  module_size: 3
  selection_split: calibration

abc:
  fit_families:
    - bounded_trait_space
  base_anchors:
    - fitted_current_best
    - fitted_smooth_core_only
  component_guardrails:
    default_max_component_distance: 2.5
    penalty_weight: 0.5
    metric_max_component_distance:
      sign_epistasis_fraction: 2.5
      reciprocal_sign_epistasis_fraction: 2.5
      n_local_maxima: 2.0
      accessible_path_fraction: 2.0
      random_walk_lag1_autocorrelation: 2.0
      walsh_high_order_fraction: 2.0
      gft_low_energy_fraction: 2.5
      gft_mid_energy_fraction: 2.5
      gft_high_energy_fraction: 2.5
      edge_energy_adjacent_moran_i: 2.0
      edge_energy_top10_fraction: 2.0
      edge_energy_effective_fraction: 2.0
      site_energy_top1_fraction: 2.0
      site_energy_effective_fraction: 2.0
      plaquette_energy_top1_fraction: 2.0
      plaquette_energy_effective_fraction: 2.0
      magnitude_epistasis_mean: 2.0
      magnitude_epistasis_median: 2.0
      magnitude_epistasis_sd: 2.5
      signed_pairwise_epistasis_mean: 2.0
      sign_epistasis_fraction_local: 2.5
      reciprocal_sign_epistasis_fraction_local: 2.5
      diminishing_returns_epistasis_fraction: 2.0
      single_mutant_effect_sd: 2.0
      magnitude_epistasis_to_single_mutant_sd_ratio: 1.5
      signed_pairwise_epistasis_sd: 2.0
      signed_pairwise_epistasis_q10: 2.5
      signed_pairwise_epistasis_q90: 2.5

bounded_trait_space_fast_fit:
  seed: 20260617
  bound_mode: tanh
  random_candidates: 32
  local_rounds: 1
  local_top_n: 4
  local_candidates_per_round: 10
  local_width_fraction: 0.20
  select_top_n: 8
  initial_bounds:
    - 0.05
    - 0.10
    - 0.25
    - 0.50
    - 1.00
  parameter_specs:
    - name: stability_margin
      kind: float
      low: 4.0
      high: 14.0
    - name: stability_scale
      kind: float
      low: 0.4
      high: 1.8
    - name: stability_conservation_power
      kind: float
      low: 0.3
      high: 1.5
    - name: threshold_steepness
      kind: float
      low: 2.0
      high: 30.0
    - name: n_epistatic_terms
      kind: int
      low: 0
      high: 600
    - name: epistasis_strength
      kind: float
      low: 0.0
      high: 0.12
    - name: empirical_pairwise_strength
      kind: float
      low: 0.0
      high: 0.18
    - name: epistasis_covariation_bias
      kind: float
      low: 0.0
      high: 1.0
    - name: pairwise_epistasis_rank
      kind: int
      low: 1
      high: 4
    - name: blosum_blend
      kind: float
      low: 0.0
      high: 1.0
    - name: trait_space_epistasis_bound
      kind: float
      low: 0.02
      high: 2.0

cumulative_fix_stages:
  - label: A
    fixes: A
    description: monotone-piecewise observation link only; EXP-044 model/search otherwise preserved
  - label: A+B
    fixes: A+B
    description: add global sigmoid stability-margin readout and constrain specific J search
    bounded_trait_space_fast_fit:
      global_readout:
        enabled: true
        source: stability_margin
        transform: sigmoid
        combine_mode: sum
        midpoint: 0.0
        slope: 1.0
        weight: 1.0
        fitness_output_scale: 1.0
      parameter_specs:
        - name: stability_margin
          kind: float
          low: 4.0
          high: 14.0
        - name: stability_scale
          kind: float
          low: 0.4
          high: 1.8
        - name: stability_conservation_power
          kind: float
          low: 0.3
          high: 1.5
        - name: threshold_steepness
          kind: float
          low: 2.0
