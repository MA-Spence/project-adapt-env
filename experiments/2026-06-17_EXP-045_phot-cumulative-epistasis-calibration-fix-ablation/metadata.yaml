id: EXP-045
type: experiment
title: PHOT cumulative epistasis calibration fix ablation
slug: phot-cumulative-epistasis-calibration-fix-ablation
status: completed
created: '2026-06-17T04:40:10+10:00'
owner: matthew-spence
scientific_context:
  aims:
  - AIM-001
  hypotheses:
  - HYP-004
  - HYP-009
  previous_experiments: []
  motivating_results:
  - RES-040
  - RES-042
  - RES-043
question: Do the RES-043 epistasis-calibration fixes A through D, added cumulatively,
  resolve the PHOT magnitude-epistasis/accessibility tradeoff under the existing numerical
  fast-fit protocol?
pre_experiment_prediction: Fix A should test whether a monotone observation link alone
  can raise observable magnitude epistasis without collapsing accessibility; if not,
  the cumulative A+B, A+B+C, and A+B+C+D stages should show whether global-nonlinearity
  sourcing, an explicit specific-epistasis variance-ratio knob, and scale-invariant/distribution-conditioned
  objectives are needed.
rationale: RES-043 showed that bounded trait-space routing improved component guardrails
  but left raw latent epistasis far too large and accessibility unstable. The scratch
  RES-043 calibration review argues that the defect is a combination of affine readout
  ratio invariance, sourcing magnitude epistasis from specific J, lack of an explicit
  epistasis/additive variance-ratio target, and poor objective conditioning around
  near-zero signed means. This experiment tests those fixes cumulatively on PHOT before
  any broader scale-up.
