question: Do hashed GNK/RMF-style epistatic-texture knobs, added inside the retained
  stability-threshold core and readout, set local maxima, accessibility, Walsh spectrum,
  and sign/reciprocal epistasis in the predicted directions?
pre_experiment_prediction: The core-only condition will retain neutrality and diminishing-returns
  structure, while increasing hashed GNK epistasis weight will increase local maxima
  and high-order/sign epistasis and reduce accessibility; structured and shuffled
  routing should be matched for global statistics but differ in support localization.
rationale: RES-047 and RES-048 argue against another PHOT inverse-fit loop. This WS-B
  experiment replaces the failing residual epistasis module with a lazy hashed GNK
  texture layer and validates knob-to-statistic maps directly on enumerable model
  coordinates.
