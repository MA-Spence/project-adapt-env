question: Can the public thermodynamic model produce useful global empirical resemblance
  across every available assay with appropriate measured combinatorial coverage, without
  fitting empirical interaction identities?
pre_experiment_prediction: Global sigmoid calibration will provide useful regimes
  across multiple assay classes, with system-specific residuals and observation dependence;
  no universal setting or scientific success gate is imposed.
rationale: Production figure dataset extending EXP-065 using the released public method,
  geometry-matched synthetic panels, disjoint empirical calibration/confirmation,
  fresh generator seeds, explicit suitability and noise assumptions.
