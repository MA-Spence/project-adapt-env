question: Does an operator-normalized, extensive, balanced-support, bounded-contrast
  GNK latent field preserve controllable mutation-effect scale from local substitutions
  through protein-scale sequence differences before any sigmoid readout?
pre_experiment_prediction: At fixed mutation-RMS weight, the candidate GNK field will
  have length-invariant local effects, field variance proportional to sequence length,
  and square-root scaling across extensive Hamming distances, while the current fixed-term
  public GNK control reproduces its length defect.
rationale: Protein-scale failures remain confounded by latent GNK scale semantics.
  This experiment isolates and preregisters the latent repair before any transmission
  through the public sigmoid.
