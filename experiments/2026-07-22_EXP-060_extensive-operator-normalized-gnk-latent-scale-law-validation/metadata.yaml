notes:
- This experiment ends at the additive and GNK latent components. It neither invokes
  observable fitness nor transmits GNK through a sigmoid.
- The extensive candidate remains experiment-local. A pass does not change the public
  AdaptEnv method, establish empirical realism, or validate optimizer behavior.
- HYP-004 and HYP-009 remain downstream; only HYP-005 is tested directly.
- Reference-shell GNK differences test full-protein scaling. Uniform-background pairs
  identify the mutation-operator amplitude ratio without the directional mean drift
  of mutations away from a natural reference.
- The six exact reference sequences and their SHA-256 digests are frozen in config.yaml;
  dataset identifiers and source CSV paths retain provenance without requiring the
  full Stage-4 bundle at run time.
