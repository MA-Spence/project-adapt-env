legacy_control:
  terms: 384
  min_order: 2
  max_order: 4
  order_weights: [0.35, 0.45, 0.20]
  support_mode: structured
  seed_offset: 10000

candidate:
  implementation: src/project_adapt_env/extensive_gnk.py
  seed_offset: 30000
  orders: [2, 3, 4]
  order_weights: [0.35, 0.45, 0.20]
  target_degrees: [6, 11, 7]
  term_count_rule: ceil_L_times_target_degree_divided_by_order
  support_rule: unique_nearly_regular_simple_hypergraph_per_order
  contrast_rule: balanced_permuted_bounded_q20_rademacher
  reference_centered: true
  coefficient_rule: exact_uniform_background_mutation_operator_energy

intervention:
  weights: [0.0, 0.25, 0.5, 1.0, 2.0]
  working_weight: 1.0
  weight_semantics:
    legacy_public_global_fixed: raw_public_multiplier
    legacy_support_local_normalized: target_mutation_rms_ratio_to_additive
    extensive_balanced_bounded: target_mutation_rms_ratio_to_additive
  derive_all_weights_from_one_field_per_arm: true

probe:
  regimes: [reference_shell, uniform_background]
  hamming_distances: [1, 2, 4, 8, "0.1L", "0.5L"]
  pairs_per_distance: 512
  eval_chunk_size: 2048
  supported_pair_curvature_samples: 512
  mutation_operator:
    site_distribution: uniform_without_replacement
    source_distribution_uniform_background: uniform_q20
    replacement_distribution: uniform_over_19_nonself_states
  pair_key_excludes: [arm, weight]

acceptance:
  bootstrap_replicates: 10000
  bootstrap_seed: 60060
  reference_center_atol: 1.0e-12
  support_max_degree_range: 1
  support_max_cv: 0.10
  support_max_duplicate_fraction: 0.01
  contrast_moment_atol: 1.0e-12
  local_ratio_median_band: [0.85, 1.15]
  local_ratio_seed_band: [0.70, 1.30]
  local_ratio_min_seed_fraction: 0.90
  local_slope_abs_max: 0.10
  local_slope_ci_abs_max: 0.20
  min_slope_improvement: 0.25
  field_variance_slope_band: [0.80, 1.20]
  field_variance_per_length_cv_max: 0.20
  fractional_distance_slope_band: [0.35, 0.65]
  distance_ratio_slope_abs_max: 0.15
  fixed_distance_slope_abs_max: 0.15
  weight_linearity_relative_error_max: 0.02
  weight_linearity_r2_min: 0.9999
  order_variance_fraction_atol: 0.10
  curvature_slope_abs_max: 0.15
  q20_median_pearson_kurtosis_max: 6.0
  legacy_local_slope_expected_band: [-0.70, -0.30]
  require_legacy_defect_reproduction: true

decision_rule:
  pass: LATENT_GNK_EXTENSIVE_SCALE_LAW_VALIDATED
  local_normalization_pass_primary_fail: SUPPORT_OR_CONTRAST_REPAIR_INCOMPLETE
  local_scale_fail: OPERATOR_NORMALIZATION_FAILED
  support_fail: EXTENSIVE_SUPPORT_CONSTRUCTION_FAILED
  contrast_fail: BOUNDED_Q20_CONTRAST_IMPLEMENTATION_FAILED
  full_sequence_fail: LOCAL_SCALE_DOES_NOT_GENERALIZE_TO_FULL_SEQUENCE_DISTANCE
  technical_fail: EXECUTION_OR_PAIRING_INVALID
  other_fail: LATENT_GNK_SCALE_LAW_FAILED_OTHER_GATE
  downstream_on_any_failure: keep_sigmoid_transmission_test_blocked

outputs:
