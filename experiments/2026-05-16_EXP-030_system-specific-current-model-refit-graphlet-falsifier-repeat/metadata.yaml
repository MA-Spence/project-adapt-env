id: EXP-030
type: experiment
title: System-specific current-model refit and graphlet falsifier repeat
slug: system-specific-current-model-refit-graphlet-falsifier-repeat
status: planned
created: '2026-05-16T17:36:47+10:00'
owner: matthew-spence
scientific_context:
  aims:
  - AIM-001
  hypotheses:
  - HYP-001
  - HYP-004
  - HYP-005
  previous_experiments:
  - EXP-028
  - EXP-029
  motivating_results:
  - RES-028
  - RES-029
question: 'When PHOT and SPTN1 are fit as two separate current-model landscapes rather
  than pooled, do the RES-028 fired falsifiers still hold: wrong empirical spectral
  envelope and wrong embedded evolutionary/topological dynamics?'
pre_experiment_prediction: If the RES-028 failure was mainly caused by stale cached
  preprocessing and the RUN-073 pooling error, then assay-specific current-model ABC
  fits should produce posterior predictive graphlets whose WHT/GFT spectra, SE/RSE,
  local maxima, accessibility and random-walk autocorrelation match each system better
  than smooth-core, residual-only and GNK-style controls. If the fired falsifiers
  persist, the current residual-ruggedness mechanism remains structurally inadequate
  even after system-specific recalibration.
rationale: 'CLAIM-001 supersedes the original pooled/shared-regime HYP-001 interpretation:
  empirical-like statistics are recoverable, if at all, system by system. RUN-073
  incorrectly pooled PHOT and SPTN1 into one shared ABC target and did not emit graphlet
  WHT/GFT statistics. This experiment repeats the current-model refit correctly as
  two independent landscape fits in one run, then tests the RES-028 fired graphlet
  breakpoints on each fitted system.'
