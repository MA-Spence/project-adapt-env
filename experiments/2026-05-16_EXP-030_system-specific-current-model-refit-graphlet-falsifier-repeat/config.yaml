experiment_id: EXP-030
title: System-specific current-model refit and graphlet falsifier repeat
stack: STACK-000
target: lab-slurm

experiment:
  id: EXP-030
  status: planned
  runner_status: ready_for_submission
  planned_runner: scripts/proteingym_system_specific_current_graphlet_refit.py
  scientific_boundary:
    primary_hypothesis: HYP-001
    linked_hypotheses:
      - HYP-004
      - HYP-005
    motivating_results:
      - RES-028
      - RES-029
    no_pooling_rule: fit PHOT and SPTN1 as two independent single-assay landscapes; never pool assays into one ABC target
    stale_cache_rule: legacy prepared empirical outputs may inform design checks only; they must not provide current-model empirical parameters
    current_semantics_rule: fit raw ProteinGym assays with stability-margin readout and stability-routed residual epistasis; do not fit legacy FGM, designed peak distance, deterministic roughness, or exact-match high-order terms
    fired_res028_breakpoints_tested:
      - wrong_spectral_envelope
      - wrong_evolutionary_dynamics
      - scale_confounding
      - smooth_core_only_equivalence

proteingym:
  version: v1.3
  reference_csv_url: https://raw.githubusercontent.com/OATML-Markslab/ProteinGym/main/reference_files/DMS_substitutions.csv
  substitutions_parquet_url: https://proteingym.s3.us-east-2.amazonaws.com/DMS_substitutions.parquet
  reference_csv_path: data/raw/proteingym/v1.3/reference/DMS_substitutions.csv
  substitutions_parquet_path: data/raw/proteingym/v1.3/DMS_substitutions.parquet
  assay_output_dir: data/raw/proteingym/v1.3/assays

panel:
  panel_size: 1
  assays_per_taxon: 0
  allowed_taxa: []
  coarse_selection_type: null
  selection_type: null
  require_multiple_mutants: true
  min_single_mutants: 800
  min_multiple_mutants: 300
  max_sequence_length: 140
  assay_ids: []
  assay_roles: {}
  stale_cache_use: {}

mmseqs:
  alignment_dir: data/interim/proteingym_mmseqs_alignments
  cache_dir: data/interim/proteingym_mmseqs_cache
  max_alignment_sequences: 512
  timeout_seconds: 20.0
  poll_interval_seconds: 5.0
  max_retries: 6

mavenn:
  alphabet: protein
  regression_type: GE
  gpmap_type: additive
  ge_nonlinearity_type: nonlinear
  ge_nonlinearity_monotonic: true
  ge_noise_model_type: SkewedT
  ge_heteroskedasticity_order: 2
  theta_regularization: 0.0001
  eta_regularization: 0.0001
  max_mutation_count: 3
  max_variants_per_assay: 12000
  sample_seed: 17
  test_holdout_modulo: 10
  test_holdout_remainder: 0
  report_information_metrics: false
  validation_fraction: 0.1
  epochs: 60
  learning_rate: 0.005
  early_stopping_patience: 8
  batch_size: 256

adapt_env:
  base_config:
    observed_fitness_combine_mode: stability_margin
    stability_margin: 8.0
    stability_scale: 1.0
    stability_conservation_power: 1.0
    threshold_steepness: 20.0
    fitness_output_scale: 10.0
    generic_epistasis_target: stability
    n_epistatic_terms: 220
    epistasis_strength: 0.025
    empirical_pairwise_strength: 0.025
    pairwise_epistasis_rank: 2
    epistasis_covariation_bias: 0.8
    n_higher_order_epistatic_terms: 0
    noise_amplitude: 0.0
    noise_heterogeneity: 0.0
    peak_search_steps: 400
    peak_search_top_single_starts: 8
    peak_search_random_starts: 8
    peak_search_random_radius: 2
    peak_distance_from_consensus: 0
    use_blosum_kernel: true
    blosum_blend: 0.5
    seed: 42

calibration_max_mutation_count: 2

deterministic_branches: {}

resume:
  source_run_id: RUN-075
  reuse_completed_system_fits: true
  rationale: RUN-075 completed the PHOT current-model ABC fit and failed during graphlet post-processing because the graphlet metadata lacked the split key required by the shared GFT writer; resumed runs should reuse completed per-system fit checkpoints and continue downstream work instead of rerunning completed ABC fits

sampling_budget:
  source_result: RES-029
  source_run: RUN-073
  source_design: pooled two-assay ABC target, later judged scientifically invalid for this question
  run073_empirical_smc_attempts: 1920
  run073_replicates_per_particle: 2
  run073_round_best_distances:
    - 10.7975
    - 10.9120
    - 10.7028
    - 10.8228
  run073_round_median_distances:
    - 11.4633
    - 11.3126
    - 11.2745
    - 11.3671
  run073_sampling_diagnosis: round 2 reached the best pooled objective and round 3 did not improve; final posterior ESS was high and broad rather than contractive
  reduced_design: three SMC rounds, one replicate per particle, 48 particles, 5x initial pool, 6x proposal pool
  reduced_attempts_per_system: 816
  reduced_total_attempts_two_systems: 1632
  rationale: the sampling reduction removes the apparently wasteful fourth round and duplicate simulation replicate while preserving the early exploratory and two proposal rounds that carried nearly all improvement in RUN-073

abc:
  backend:
    kind: ray
    max_workers: 8
    batch_size: 8
  distance_mode: summary_vector
  selected_features:
    - mean
    - variance
    - skewness
    - fraction_neutral
    - fraction_beneficial
    - fraction_deleterious
    - fraction_lethal
    - conservation_correlation
    - epistasis_variance
  bootstrap_replicates: 128
  covariance_shrinkage: 0.35
  covariance_ridge: 1.0e-6
  replicates_per_particle: 1
  calibration:
    neutral_threshold: 0.25
    beneficial_threshold: 0.25
    lethal_relative_threshold: 0.1
    max_landscapes_per_fit: 1
    max_observed_sequences: 8192
    max_double_mutants: 8192
    synthetic_seed: 1357
    query_missing_alignments: false
    single_mutant_holdout_modulo: 5
    single_mutant_holdout_remainder: 0
    double_mutant_holdout_modulo: 5
    double_mutant_holdout_remainder: 0
    double_mutant_holdout_scheme: pair
    synthetic_readout_mode: stability_margin
    empirical_pairwise_target: stability
    observation_model_kind: auto
    observation_model_max_knots: 12
    observation_model_min_bin_size: 16
    empirical_pairwise_model: regularized_low_rank
    empirical_pairwise_max_pairs: 0
    empirical_pairwise_rank: 4
    empirical_pairwise_prior_strength: 1.0
    empirical_pairwise_shared_template_weight: 0.0
    empirical_pairwise_observed_prior_blend: 0.0
    empirical_pairwise_coverage_shrink_power: 0.0
    empirical_pairwise_normalization: none
  parameters:
    - name: stability_scale
      kind: float
      low: 0.5
      high: 1.5
    - name: stability_margin
      kind: float
      low: 4.0
      high: 14.0
    - name: threshold_steepness
      kind: float
      low: 8.0
      high: 40.0
    - name: blosum_blend
      kind: float
      low: 0.2
      high: 0.8
    - name: stability_conservation_power
      kind: float
      low: 0.75
      high: 1.35
    - name: n_epistatic_terms
      kind: int
      low: 0
      high: 420
    - name: epistasis_strength
      kind: float
      low: 0.0
      high: 0.10
    - name: empirical_pairwise_strength
      kind: float
      low: 0.0
      high: 0.10
    - name: pairwise_epistasis_rank
      kind: int
      low: 1
      high: 6
    - name: epistasis_covariation_bias
      kind: float
      low: 0.0
      high: 1.0
  smc:
    n_particles: 48
    n_rounds: 3
    initial_pool_multiplier: 5
    proposal_pool_multiplier: 6
    epsilon_quantile: 0.6
    seed: 2030

synthetic_truth_recovery:
  enabled: false
  backend:
    kind: ray
    max_workers: 8
    batch_size: 8
  replicates_per_particle: 1
  smc:
    n_particles: 16
    n_rounds: 2
    initial_pool_multiplier: 4
    proposal_pool_multiplier: 4
    epsilon_quantile: 0.6
    seed: 404
  truths: []

stale_cache_controls:
  enabled: true
  use_policy: design_check_only_not_parameter_source
  sources:
    - RUN-024
    - RUN-026
    - RUN-071
    - RUN-073

graphlet_evaluation:
  primary_score_column: latent_phi
  score_columns:
    - mavenn_yhat
    - latent_phi
  global_readout_polynomial_degree: 3
  metric_columns:
    - sign_epistasis_fraction
    - reciprocal_sign_epistasis_fraction
    - n_local_maxima
    - accessible_path_fraction
    - random_walk_lag1_autocorrelation
    - walsh_high_order_fraction
    - gft_low_energy_fraction
    - gft_mid_energy_fraction
    - gft_high_energy_fraction
  spectral_envelope:
    min_low_fraction: 0.50
    min_high_order_fraction: 0.01
    max_high_order_fraction: 0.35
  control_equivalence_margin: 1.05
  smooth_core_margin: 1.10
  scale_confounding:
    min_retained_high_order_fraction: 0.25

analysis:
  random_walk:
    n_walks_per_graphlet: 20
    steps: 32
    lag_max: 5
  walsh:
    max_order: 6
    record_all_terms: false
    max_recorded_terms_per_graphlet_model: 12
  gft:
    record_all_coefficients: false
    max_recorded_terms_per_graphlet_model: 12
    eigenvalue_bands:
      low:
        max_quantile: 0.33
      mid:
        min_quantile: 0.33
        max_quantile: 0.67
      high:
        min_quantile: 0.67
  sign_epistasis:
    record_pair_rows: false
  topology:
    record_local_extrema: true
    record_basins: true
    record_accessible_paths: true

systems:
  - assay_id: PHOT_CHLRE_Chen_2023
    role: primary_high_order_activity_graphlet_panel
    graphlets:
      dimensions:
        - 4
        - 5
        - 6
      max_graphlets_per_dimension: 8
      top_feature_pool: 42
      prior_design_check: RUN-073 prepared data produced complete 4D, 5D and 6D graphlets at this setting
  - assay_id: SPTN1_CHICK_Tsuboyama_2023_1TUD
    role: tsuboyama_stability_pairwise_graphlet_control
    graphlets:
      dimensions:
        - 2
        - 3
        - 4
      max_graphlets_per_dimension: 8
      top_feature_pool: 80
      known_limitation: RUN-073 prepared data had complete 2D graphlets only; no complete 3D or 4D graphlets were found up to top_feature_pool 120, so the high-order spectral envelope falsifier may be non-testable for this system

outputs:
  output_dir_name: proteingym-system-specific-current-model-refit-graphlet-falsifier-repeat
  expected_files:
    - summary.json
    - current_model_preflight.json
    - falsification_tests.json
    - system_fit_summary.csv
    - system_branch_validations.csv
    - system_graphlet_catalog.csv
    - system_graphlet_metrics.csv
    - system_walsh_terms.csv
    - system_gft_coefficients.csv
    - system_model_distances.csv
    - systems/PHOT_CHLRE_Chen_2023/fit/summary.json
    - systems/PHOT_CHLRE_Chen_2023/fit/posterior_particles.csv
    - systems/PHOT_CHLRE_Chen_2023/graphlet_metrics.csv
    - systems/PHOT_CHLRE_Chen_2023/walsh_terms.csv
    - systems/PHOT_CHLRE_Chen_2023/gft_coefficients.csv
    - systems/SPTN1_CHICK_Tsuboyama_2023_1TUD/fit/summary.json
    - systems/SPTN1_CHICK_Tsuboyama_2023_1TUD/fit/posterior_particles.csv
    - systems/SPTN1_CHICK_Tsuboyama_2023_1TUD/graphlet_metrics.csv
    - systems/SPTN1_CHICK_Tsuboyama_2023_1TUD/walsh_terms.csv
    - systems/SPTN1_CHICK_Tsuboyama_2023_1TUD/gft_coefficients.csv

quick:
  mavenn:
    max_variants_per_assay: 1200
    epochs: 3
    early_stopping_patience: 1
    batch_size: 128
  abc:
    backend:
      kind: serial
      max_workers: 1
      batch_size: 1
    bootstrap_replicates: 8
    replicates_per_particle: 1
    smc:
      n_particles: 4
      n_rounds: 1
      initial_pool_multiplier: 2
      proposal_pool_multiplier: 2
      epsilon_quantile: 0.7
      seed: 113
  synthetic_truth_recovery:
    enabled: false
  analysis:
    random_walk:
      n_walks_per_graphlet: 4
      steps: 12
      lag_max: 3
  systems:
    - assay_id: PHOT_CHLRE_Chen_2023
      role: primary_high_order_activity_graphlet_panel
      graphlets:
        dimensions:
          - 4
        max_graphlets_per_dimension: 2
        top_feature_pool: 42
    - assay_id: SPTN1_CHICK_Tsuboyama_2023_1TUD
      role: tsuboyama_stability_pairwise_graphlet_control
      graphlets:
        dimensions:
          - 2
        max_graphlets_per_dimension: 2
        top_feature_pool: 80
