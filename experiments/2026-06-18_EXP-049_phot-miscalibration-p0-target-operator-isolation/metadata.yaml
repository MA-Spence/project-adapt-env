question: Are the PHOT target summaries and sparse-Walsh support sampler measured
  on a common footing, as tested by P0.1 target uncertainty, P0.2 round-trip measurement
  calibration, and P0.3 support-containment audit?
pre_experiment_prediction: The local-energy and high-order empirical target components
  will be unstable under bootstrap or MAVE-NN refit, injected order-3 spectra will
  be distorted by the empirical measurement operator, and support containment will
  quantify whether sparse-Walsh supports are visible to sampled dense graphlets.
rationale: RES-047 and scratch/RES-047_miscalibration_root_cause_and_isolation_plan.md
  argue that the spectrum-calibrated sparse-Walsh forward gate may be failing because
  target summaries, MAVE-NN latent measurement, and dense graphlet sampling are not
  on a common footing. This experiment pauses new generator engineering and isolates
  P0.1, P0.2, and P0.3 in one PHOT-only diagnostic.
