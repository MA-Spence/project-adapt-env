question: Does replacing collapsed binding fitness with a paired abundance-plus-binding
  thermodynamic readout improve empirical recovery on the matched KRAS ProteinGym
  assays `RASK_HUMAN_Weng_2022_abundance` and `RASK_HUMAN_Weng_2022_binding-DARPin_K55`?
pre_experiment_prediction: If `RES-008` failed mainly because `PHOT_CHLRE` fluorescence
  is not a clean two-latent assay and because one readout leaves stability and function
  weakly identifiable, then a paired KRAS abundance-plus-binding fit with a three-state
  folded/unfolded/bound readout should improve binding holdout ranking, double-mutant
  recovery, epistasis prediction, and reference-to-peak behavior relative to both
  binding-only raw controls and paired raw-readout controls.
rationale: '`RES-008` does not cleanly falsify the broader multi-latent idea in `HYP-007`;
  it tests a fluorescence reporter whose score likely mixes folded fraction, FMN occupancy,
  and chromophore photophysics, while providing only one measured phenotype to identify
  multiple latent molecular traits. The literature points to a sharper causal test.
  Otwinowski''s GB1 reanalysis and the KRAS `ddPCA` work from Weng et al. both show
  that binding assays are better explained by explicit folding-plus-binding thermodynamic
  models than by a collapsed scalar score, especially when orthogonal abundance data
  and many double-mutant backgrounds are available. This experiment therefore moves
  from the underidentified single-readout `PHOT_CHLRE` setting to a matched KRAS abundance-plus-binding
  pair with substantial multi-mutant coverage, and compares raw collapsed baselines
  against an explicit thermodynamic binding readout calibrated jointly across the
  two assays.'
