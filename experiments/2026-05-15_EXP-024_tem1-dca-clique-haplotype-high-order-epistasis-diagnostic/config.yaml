experiment_id: EXP-024
title: TEM-1 DCA clique haplotype high-order epistasis diagnostic
stack: STACK-000
target: lab-slurm
seeds:
  - 9501
  - 9502
  - 9503

reference:
  protein: TEM-1 beta-lactamase
  uniprot_id: P62593
  source: UniProt reviewed BLAT_ECOLX sequence
  sequence: MSIQHFRVALIPFFAAFCLPVFAHPETLVKVKDAEDQLGARVGYIELDLNSGKILESFRPEERFPMMSTFKVLLCGAVLSRVDAGQEQLGRRIHYSQNDLVEYSPVTEKHLTDGMTVRELCSAAITMSDNTAANLLLTTIGGPKELTAFLHNMGDHVTRLDRWEPELNEAIPNDERDTTMPAAMATTLRKLLTGELLTLASRQQLIDWMEADKVAGPLLRSALPAGWFIADKSGAGERGSRGIIAALGPDGKPSRIVVIYTTGSQATMDERNRQIAEIGASLIKHW

alignment:
  source: MMSeqs ColabFold MSA API
  max_sequences: 768
  mmseqs_cache_dir: .labproj/cache/mmseqs
  poll_interval_seconds: 5
  timeout_seconds: 20
  max_retries: 6

adapt_env:
  base_config:
    observed_fitness_combine_mode: stability_margin
    stability_scale: 1.0
    stability_margin: 8.0
    stability_conservation_power: 1.0
    threshold_steepness: 20.0
    fitness_output_scale: 10.0
    generic_epistasis_target: stability
    empirical_pairwise_strength: 0.0
    n_epistatic_terms: 0
    epistasis_strength: 0.0
    epistasis_covariation_bias: 0.0
    pairwise_epistasis_rank: 2
    n_higher_order_epistatic_terms: 0
    epistasis_order_max: 5
    epistasis_order_decay: 1.5
    noise_amplitude: 0.0
    noise_heterogeneity: 0.0
    peak_search_steps: 40
    peak_search_top_single_starts: 2
    peak_search_random_starts: 2
    peak_search_random_radius: 1
    peak_distance_from_consensus: 0
    use_blosum_kernel: true
    blosum_blend: 0.5

anchor_selection:
  mode: closest_realized_margin
  target_effective_stability_margin: 1.0
  max_reported_candidates: 5000

dca_haplotype_terms:
  orders:
    - 2
    - 3
    - 4
    - 5
  maps_per_order: 4
  scan_top_couplings: 8000
  max_clique_positions: 140
  max_clique_candidates_per_order: 12000
  min_haplotype_frequency: 0.0001
  min_haplotype_frequency_by_order:
    2: 0.001
    3: 0.0005
    4: 0.0002
    5: 0.0001
  min_haplotype_log2_enrichment: -2.0
  coefficient_sign_mode: alternating
  strength_grid:
    - 0.0
    - 250.0
    - 750.0
    - 1500.0
    - 3000.0

context_variable:
  min_frequency: 0.02
  target_single_delta: -20.0
  single_delta_tolerance: 120.0
  max_abs_single_delta: 500.0

quick:
  seeds:
    - 19501
  alignment:
    max_sequences: 96
    synthetic_smoke_sequences: true
    synthetic_smoke_seed: 1902
  adapt_env:
    base_config:
      peak_search_steps: 4
      peak_search_top_single_starts: 1
      peak_search_random_starts: 1
      peak_search_random_radius: 1
  anchor_selection:
    mode: reference
    max_reported_candidates: 128
  dca_haplotype_terms:
    orders:
      - 2
      - 3
    maps_per_order: 1
    scan_top_couplings: 500
    max_clique_positions: 48
    max_clique_candidates_per_order: 2000
    min_haplotype_frequency: 0.0001
    min_haplotype_frequency_by_order:
      2: 0.0001
      3: 0.0001
    min_haplotype_log2_enrichment: -10.0
    coefficient_sign_mode: alternating
    strength_grid:
      - 0.0
      - 1000.0
  context_variable:
    min_frequency: 0.0001
    target_single_delta: -20.0
    single_delta_tolerance: 500.0
    max_abs_single_delta: 2000.0
