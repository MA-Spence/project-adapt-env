question: Can DCA/contact-graph cliques with observed MSA haplotype exact-match terms
  create controllable third-, fourth-, and fifth-order Walsh-Hadamard components in
  local TEM-1 Adapt-Env Hamming maps when the old generic epistasis layer is disabled?
pre_experiment_prediction: Increasing the DCA haplotype exact-match coefficient should
  monotonically increase the target-order Walsh coefficient and target-order variance
  fraction. The upper strength setting should produce a clearly nonzero fifth-order
  Walsh term in order-5 maps. Sign epistasis may change as a secondary diagnostic,
  but reciprocal sign epistasis is not the primary success criterion for this experiment.
rationale: 'RES-023 showed that DCA-prior state-specific pair terms create strong
  pairwise/sign epistasis but leave higher-order Walsh terms essentially absent. This
  experiment tests a structurally different mechanism: sparse exact-match terms on
  observed MSA haplotypes supported by DCA/contact-graph cliques. Each order-n term
  is evaluated in a dense 2^(n+1) local Hamming grid so the expected interaction order
  is directly measurable.'
