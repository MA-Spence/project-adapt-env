id: EXP-034
type: experiment
title: PHOT budgeted module-tied soft-min ABC
slug: phot-budgeted-module-tied-softmin-abc
status: completed
created: '2026-05-17T09:18:15+10:00'
owner: matthew-spence
scientific_context:
  aims:
  - AIM-001
  hypotheses:
  - HYP-008
  previous_experiments:
  - EXP-030
  - EXP-031
  - EXP-032
  - EXP-033
  motivating_results:
  - RES-030
  - RES-031
  - RES-032
  - RES-033
question: 'For PHOT, does fitting an explicit module-tied state-difference field d(x)=b(x)-a(x),
  with finite-difference energy and state-boundary budgets, allow a frozen-base soft-min
  operator to improve calibration-selected held-out graphlet topology, spectra, and
  locality relative to fitted-current, smooth-core, residual, random/shuffled-module,
  no-module, and GNK controls?

  '
pre_experiment_prediction: 'A supporting result requires calibration-selected posterior
  candidates to beat fitted-current and smooth-core controls on held-out graphlet
  distance while preserving base correlation and keeping innovation edge/plaquette
  energy within the empirical residual budget. Assay-objective improvement alone remains
  insufficient support for HYP-008.

  '
rationale: 'RES-033 showed that the previous soft-min/Boltzmann ABC family could improve
  calibration graphlet distance but generated very large, non-empirical state-transition
  innovation and failed held-out graphlets. EXP-034 tests the specific diagnosis that
  b(x) should be parameterised through a module-tied d(x)=b(x)-a(x) field and constrained
  by explicit smoothness/energy budgets, rather than by a globally correlated auxiliary
  landscape alone.

  '
