question: Does fitting the PHOT_CHLRE multi-mutant activity assay through the new
  observed-fitness composition path, with scalar fitness formed as a latent activity
  readout rather than a collapsed post hoc score, improve recovery under the single-assay
  SMC-ABC workflow?
pre_experiment_prediction: If RES-008 failed partly because the previous activity
  model still treated the assay readout as an auxiliary calibration view over a legacy
  collapsed generator, then promoting activity to the public observed-fitness readout
  and routing epistasis through the latent function layer should improve holdout ranking,
  epistasis prediction, and reference-to-peak behavior on PHOT_CHLRE relative to the
  earlier experiment.
rationale: RES-007 showed that calibration improves when the fitted readout matches
  the latent causal quantity. RES-008 then showed that the first PHOT_CHLRE stability-plus-function
  implementation did not outperform the raw control, which suggests the remaining
  mismatch may be structural rather than merely parametric. The new Adapt-Env observed-fitness
  composition path now allows the scalar benchmark fitness itself to be generated
  from latent molecular components instead of leaving activity as a special secondary
  readout layered onto the historical collapsed score. This experiment returns to
  the same multi-mutant PHOT_CHLRE assay used in EXP-008 and tests whether making
  activity the actual observed fitness, with epistasis routed through the latent function
  layer before collapse, improves empirical recovery under otherwise matched single-assay
  calibration.
