question: Does the Bayesian SMC-ABC calibration from EXP-005 recover one empirical
  assay from the paired six-assay panel when pooling is removed, using SPTN1_CHICK_Tsuboyama_2023_1TUD
  as a single-dataset diagnostic?
pre_experiment_prediction: If pooling across assays is a major bottleneck, then fitting
  the same Bayesian calibration path to only SPTN1_CHICK_Tsuboyama_2023_1TUD should
  materially improve single-mutant and double-mutant holdout recovery relative to
  the shared six-assay fit while retaining nonzero epistatic structure.
rationale: RES-003 and RES-004 already weakened the claim that pooling alone explains
  the calibration failure, but both relied on deterministic fitters. RES-005 then
  showed that the Bayesian fitter can recover structured parameters on model-matched
  synthetic targets and no longer fails by trivial collapse, yet the shared six-assay
  empirical fit remained weak. This experiment isolates whether removing cross-assay
  pooling on the strongest per-assay candidate from the paired panel makes the empirical
  inverse problem materially easier under the same SMC-ABC path.
