question: Does adding a locked third latent residual landscape through nested independently
  parameterised Boltzmann/soft-min coupling improve PHOT held-out graphlet and local-ruggedness
  performance beyond the locked first-stage coupled model and matched negative controls?
pre_experiment_prediction: If prior improvements mostly reflect latent residual capacity,
  a nested third landscape should improve held-out graphlet distance and local ruggedness
  statistics over the locked first-stage model, but matched random/shuffled/uncoupled
  controls may remain close; a mechanistic interpretation requires empirical-module
  specificity beyond these controls.
rationale: RUN-091 and RUN-096 show that secondary residual capacity improves PHOT
  held-out graphlet and local-ruggedness metrics, but does not identify residue-specific
  empirical modules. This experiment tests whether increasing ensemble capacity with
  a second independently parameterised coupling layer gives stable predictive improvement,
  and whether any gain is specific to empirical module structure or simply generic
  latent capacity.
