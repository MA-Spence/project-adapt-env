question: Can the additive-core plus binary-rank-8 extensive-GNK stability-gate observable,
  with beta and reference occupancy swept, specifically cover the rugged upper quantiles
  of the frozen Tier-1 empirical descriptor envelope?
pre_experiment_prediction: At least one beta, p0, and GNK-amplitude region will place
  the structured binary-rank-8 observable within at least five of eight descriptor
  bands for at least 80% of rugged-end Tier-1 templates while retaining accessibility
  and exceeding additive, shuffled, and random controls.
rationale: RES-061 repairs observable texture prevalence on the fixed challenge panel,
  but RES-051/052 leave forward empirical-envelope coverage and specificity unresolved
  and used the prior representation or frozen deployment operating point. This probe
  tests that expressivity prerequisite without fitting.
