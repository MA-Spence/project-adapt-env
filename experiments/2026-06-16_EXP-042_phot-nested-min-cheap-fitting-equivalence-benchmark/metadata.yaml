id: EXP-042
type: experiment
title: PHOT nested-min cheaper fitting protocol equivalence benchmark
slug: phot-nested-min-cheap-fitting-equivalence-benchmark
status: planned
created: '2026-06-16T11:11:58+10:00'
owner: matthew-spence
scientific_context:
  aims:
  - AIM-001
  hypotheses:
  - HYP-004
  - HYP-009
  previous_experiments:
  - EXP-038
  - EXP-039
  - EXP-041
  motivating_results:
  - RES-038
  - RES-039
  - RES-040
question: Can deterministic summary-loss optimization, surrogate-assisted fitting,
  exact-descriptive-gated fitting, and local ABC initialized from cheap fits recover
  PHOT nested min-coupled residual landscape behavior similar to the previously computed
  full ABC fit, well enough to justify scaling the protocol to complete GB1, TrpB,
  and related combinatorial landscapes?
pre_experiment_prediction: At least one cheaper protocol will approach the full RUN-098
  nested-min ABC comparator on held-out PHOT graphlet distance and component summaries,
  but parameter equality is not required and failures will be judged on graphlet spectral,
  epistasis, local ruggedness, accessibility, and diminishing-return summaries.
rationale: Full SMC-ABC is too expensive to use as the default fitting protocol for
  complete 160,000-variant landscapes. This experiment keeps the latest PHOT nested
  min-coupled sequential residual model family fixed and tests cheaper search protocols
  against the already computed full ABC comparator before using those protocols on
  larger complete empirical landscapes.
