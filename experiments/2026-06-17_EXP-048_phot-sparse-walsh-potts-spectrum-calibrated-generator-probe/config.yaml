analysis:
  random_walk:
    n_walks_per_graphlet: 20
    steps: 32
    lag_max: 5

outputs:
  output_dir_name: phot-sparse-walsh-potts-spectrum-calibrated-generator-probe

quick:
  phot_graphlets:
    dimensions:
      - 4
    max_graphlets_per_dimension: 2
    top_feature_pool: 18
  bounded_trait_space_fast_fit:
    random_candidates: 4
    local_rounds: 1
    local_top_n: 2
    local_candidates_per_round: 2
    select_top_n: 2
    sparse_walsh_field:
      terms: 96
      spectrum_calibration:
        bootstrap_iterations: 20
        support_monte_carlo_samples: 100
      forward_probe:
        n_realizations: 2
        epi_weight_grid:
          - 0.02
        high_order_weight_multipliers:
          - 1.0
  cumulative_fix_stages:
    - label: "G"
      fixes: "G"
      description: quick G spectrum/noise-floor smoke
      bounded_trait_space_fast_fit:
        enabled: false
        sparse_walsh_field:
          spectrum_calibration:
            enabled: true
    - label: "G+H1"
      fixes: "G+H1"
      description: quick H1 forward sparse-Walsh probe smoke
      bounded_trait_space_fast_fit:
        enabled: false
        sparse_walsh_field:
          spectrum_calibration:
            enabled: false
          forward_probe:
            enabled: true
    - label: "G+H1+FIT"
      fixes: "G+H1+FIT"
      description: quick sparse-Walsh fast-fit smoke; do not gate on H1 in quick mode
      bounded_trait_space_fast_fit:
        enabled: true
        sparse_walsh_field:
          spectrum_calibration:
            enabled: false
          forward_probe:
            enabled: false
          requires_forward_probe_pass: false
