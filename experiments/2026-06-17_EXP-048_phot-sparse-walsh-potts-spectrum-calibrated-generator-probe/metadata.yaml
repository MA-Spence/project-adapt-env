question: Can a spectrum-calibrated sparse hashed Potts/Walsh field, routed through
  the existing additive stability core, pass the PHOT forward generative capability
  gate and then recover held-out RUN-098 graphlet equivalence under the recent numerical
  fast-fit protocol?
pre_experiment_prediction: If RES-046 failed because soft-min is structurally concave/unimodal,
  the sparse Walsh/Potts field should clear the forward multi-peak/high-order capability
  probe before sequence-conditioned fitting; if it clears H1 but fails held-out equivalence,
  the remaining limitation is likely the sequence-to-support map or graphlet/support
  alignment rather than the operator itself.
rationale: 'The scratch design note RES-046_scalable_multipeak_generator_design.md
  argues that the next PHOT repair should test Generator A: additive core plus sparse
  hashed high-order Walsh/Potts terms with empirical spectrum calibration, structured
  support clusters, and a forward generative capability probe rather than an inverse
  graphlet fit. This experiment implements A only and keeps the recent A/F/J calibration
  infrastructure, restricted monotone readout, frozen RUN-077 PHOT source, and RUN-098
  comparator.'
