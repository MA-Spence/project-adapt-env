question: In PHOT empirical, frozen ABC-refit current a(x), smooth-core, RUN-091 ABC
  fitted coupled families, and the random/shuffled/uncoupled controls, is Dirichlet
  ruggedness locally clustered on neighboring graphlet edges, sites, plaquettes, or
  empirical modules rather than diffuse across the dense graphlet landscape?
pre_experiment_prediction: 'Support for HYP-008 requires PHOT empirical residual ruggedness
  and the empirical-module ABC family to show stronger localized energy clustering
  than fitted current, smooth core, no-module, random-module, shuffled-module, and
  uncoupled-module controls: positive adjacent-edge Dirichlet-energy autocorrelation,
  lower effective edge/site/pair counts, higher top-edge/site/pair fractions, and
  empirical-module enrichment. If RUN-091''s diffuse-module diagnosis is correct,
  the empirical-module family will not show specific localization beyond random or
  uncoupled controls.'
rationale: 'RUN-091 improved held-out graphlet distance with ABC but failed mechanism
  specificity: random-module was fractionally better, uncoupled-module was better,
  and empirical-module energy was diffuse. This experiment does not introduce a new
  operator. It reuses the fitted RUN-091 parameters and directly tests whether the
  observed and fitted landscapes localize ruggedness or distribute Dirichlet energy
  broadly.'
