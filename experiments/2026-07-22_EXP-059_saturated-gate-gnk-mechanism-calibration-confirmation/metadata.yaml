question: Can an open stability gate and non-saturated function channel transmit a
  paired GNK-weight intervention into observable epistasis and local topology while
  preserving nonzero navigability on held-out protein-scale subspaces?
pre_experiment_prediction: At a component-qualified saturated-gate operating point,
  increasing GNK weight will increase q-ary non-additive variance, sign epistasis,
  and local-maxima density while reducing but not collapsing basin convergence on
  held-out seeds.
rationale: RES-057 leaves the saturated-gate two-channel product untested. This experiment
  uses an L=48 embedded exact calibration arm, disjoint held-out seeds, treatment-independent
  genotype designs, a weight-zero causal null, and routing controls used only for
  equivalence diagnostics.
