  hypotheses:
  - HYP-004
  - HYP-005
  previous_experiments:
  - EXP-025
  motivating_results:
  - RES-025
question: Do fixed-scale residual and high-order components become more topologically
  relevant as adaptive-walk diminishing returns reduce the smooth thermodynamic/additive
  gain, when dense graphlets are balanced across start classes and walk stages?
pre_experiment_prediction: If the relative-scale mechanism is correct, absolute residual
  high-order variance should remain controlled while residual exposure relative to
  available beneficial effects or base order-1 variance increases in later walk stages,
  accompanied by increased WHT high-order fraction, SE/RSE, local maxima, and reduced
  accessibility compared with the smooth core. Local-DFE-scaled residuals and placement
  controls test whether this is merely strength scaling rather than a biologically
  meaningful procedural mechanism.
rationale: RUN-065 showed that aggregate residuals can create local topology but failed
  the multi-start sampling design and did not make the relative-scale causal chain
  explicit. This scaled follow-up fixes graphlet-cap sampling, keeps outputs small,
  and directly records whether residual/high-order terms are unmasked as smooth adaptive
  gains diminish.
