id: EXP-026
type: experiment
title: TEM-1 relative-scale residual exposure graphlet diagnostic
slug: tem1-relative-scale-residual-exposure-graphlet-diagnostic
status: planned
created: '2026-05-15T18:30:33+10:00'
owner: matthew-spence
