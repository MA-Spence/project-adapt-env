experiment_id: EXP-029
title: ProteinGym empirical refit with current residual-ruggedness model
stack: STACK-000
target: lab-slurm

experiment:
  id: EXP-029
  status: planned
  runner_status: ready_for_submission
  planned_runner: scripts/proteingym_current_model_abc_refit.py
  scientific_boundary:
    primary_hypothesis: HYP-001
    superseded_by: CLAIM-001
    motivating_results:
      - RES-005
      - RES-006
      - RES-007
      - RES-025
      - RES-026
      - RES-027
      - RES-028
    stale_cache_rule: cached prepared empirical outputs may be replayed as controls only; they must not provide current-model empirical parameters
    current_semantics_rule: fit raw ProteinGym assays with stability-margin readout and stability-routed pairwise epistasis only; do not fit legacy FGM dimensions, designed peak distance, deterministic roughness, or higher-order exact-match terms

proteingym:
  version: v1.3
  reference_csv_url: https://raw.githubusercontent.com/OATML-Markslab/ProteinGym/main/reference_files/DMS_substitutions.csv
  substitutions_parquet_url: https://proteingym.s3.us-east-2.amazonaws.com/DMS_substitutions.parquet
  reference_csv_path: data/raw/proteingym/v1.3/reference/DMS_substitutions.csv
  substitutions_parquet_path: data/raw/proteingym/v1.3/DMS_substitutions.parquet
  assay_output_dir: data/raw/proteingym/v1.3/assays

panel:
  panel_size: 2
  assays_per_taxon: 0
  allowed_taxa: []
  coarse_selection_type: null
  selection_type: null
  require_multiple_mutants: true
  min_single_mutants: 800
  min_multiple_mutants: 300
  max_sequence_length: 140
  assay_ids:
    - PHOT_CHLRE_Chen_2023
    - SPTN1_CHICK_Tsuboyama_2023_1TUD
  assay_roles:
    PHOT_CHLRE_Chen_2023: primary_activity_graphlet_panel
    SPTN1_CHICK_Tsuboyama_2023_1TUD: previously_used_tsuboyama_stability_control
  stale_cache_use:
    PHOT_CHLRE_Chen_2023: comparison_only_RUN-026_RUN-071
    SPTN1_CHICK_Tsuboyama_2023_1TUD: comparison_only_RUN-024_RUN-071

mmseqs:
  alignment_dir: data/interim/proteingym_mmseqs_alignments
  cache_dir: data/interim/proteingym_mmseqs_cache
  max_alignment_sequences: 512
  timeout_seconds: 20.0
  poll_interval_seconds: 5.0
  max_retries: 6

mavenn:
  alphabet: protein
  regression_type: GE
  gpmap_type: additive
  ge_nonlinearity_type: nonlinear
  ge_nonlinearity_monotonic: true
  ge_noise_model_type: SkewedT
  ge_heteroskedasticity_order: 2
  theta_regularization: 0.0001
  eta_regularization: 0.0001
  max_mutation_count: 3
  max_variants_per_assay: 12000
  sample_seed: 17
  test_holdout_modulo: 10
  test_holdout_remainder: 0
  report_information_metrics: false
  validation_fraction: 0.1
  epochs: 60
  learning_rate: 0.005
  early_stopping_patience: 8
  batch_size: 256

adapt_env:
  base_config:
    observed_fitness_combine_mode: stability_margin
    stability_margin: 8.0
    stability_scale: 1.0
    stability_conservation_power: 1.0
    threshold_steepness: 20.0
    fitness_output_scale: 10.0
    generic_epistasis_target: stability
    n_epistatic_terms: 220
    epistasis_strength: 0.025
    empirical_pairwise_strength: 0.025
    pairwise_epistasis_rank: 2
    epistasis_covariation_bias: 0.8
    n_higher_order_epistatic_terms: 0
    noise_amplitude: 0.0
    noise_heterogeneity: 0.0
    peak_search_steps: 400
    peak_search_top_single_starts: 8
    peak_search_random_starts: 8
    peak_search_random_radius: 2
    peak_distance_from_consensus: 0
    use_blosum_kernel: true
    blosum_blend: 0.5
    seed: 42

calibration_max_mutation_count: 2

deterministic_branches: {}

abc:
  backend:
    kind: ray
    max_workers: 8
    batch_size: 8
  distance_mode: summary_vector
  selected_features:
    - mean
    - variance
    - skewness
    - fraction_neutral
    - fraction_beneficial
    - fraction_deleterious
    - fraction_lethal
    - conservation_correlation
    - epistasis_variance
  bootstrap_replicates: 192
  covariance_shrinkage: 0.35
  covariance_ridge: 1.0e-6
  replicates_per_particle: 2
  calibration:
    neutral_threshold: 0.25
    beneficial_threshold: 0.25
    lethal_relative_threshold: 0.1
    max_landscapes_per_fit: 2
    max_observed_sequences: 8192
    max_double_mutants: 8192
    synthetic_seed: 1357
    query_missing_alignments: false
    single_mutant_holdout_modulo: 5
    single_mutant_holdout_remainder: 0
    double_mutant_holdout_modulo: 5
    double_mutant_holdout_remainder: 0
    double_mutant_holdout_scheme: pair
    synthetic_readout_mode: stability_margin
    empirical_pairwise_target: stability
    observation_model_kind: auto
    observation_model_max_knots: 12
    observation_model_min_bin_size: 16
    empirical_pairwise_model: regularized_low_rank
    empirical_pairwise_max_pairs: 0
    empirical_pairwise_rank: 4
    empirical_pairwise_prior_strength: 1.0
    empirical_pairwise_shared_template_weight: 0.0
    empirical_pairwise_observed_prior_blend: 0.0
    empirical_pairwise_coverage_shrink_power: 0.0
    empirical_pairwise_normalization: none
  parameters:
    - name: stability_scale
      kind: float
      low: 0.5
      high: 1.5
    - name: stability_margin
      kind: float
      low: 4.0
      high: 14.0
    - name: threshold_steepness
      kind: float
      low: 8.0
      high: 40.0
    - name: blosum_blend
      kind: float
      low: 0.2
      high: 0.8
    - name: stability_conservation_power
      kind: float
      low: 0.75
      high: 1.35
    - name: n_epistatic_terms
      kind: int
      low: 0
      high: 420
    - name: epistasis_strength
      kind: float
      low: 0.0
      high: 0.10
    - name: empirical_pairwise_strength
      kind: float
      low: 0.0
      high: 0.10
    - name: pairwise_epistasis_rank
      kind: int
      low: 1
      high: 6
    - name: epistasis_covariation_bias
      kind: float
      low: 0.0
      high: 1.0
  smc:
    n_particles: 64
    n_rounds: 4
    initial_pool_multiplier: 6
    proposal_pool_multiplier: 8
    epsilon_quantile: 0.6
    seed: 2026

synthetic_truth_recovery:
  enabled: true
  backend:
    kind: ray
    max_workers: 8
    batch_size: 8
  replicates_per_particle: 1
  smc:
    n_particles: 32
    n_rounds: 3
    initial_pool_multiplier: 5
    proposal_pool_multiplier: 6
    epsilon_quantile: 0.6
    seed: 404
  truths:
    - label: current_pairwise_moderate
      updates:
        stability_scale: 1.05
        stability_margin: 8.8
        threshold_steepness: 22.0
        blosum_blend: 0.55
        stability_conservation_power: 1.0
        n_epistatic_terms: 220
        epistasis_strength: 0.035
        empirical_pairwise_strength: 0.040
        pairwise_epistasis_rank: 2
        epistasis_covariation_bias: 0.8
    - label: current_smooth_low_epistasis
      updates:
        stability_scale: 0.90
        stability_margin: 10.5
        threshold_steepness: 18.0
        blosum_blend: 0.35
        stability_conservation_power: 1.1
        n_epistatic_terms: 80
        epistasis_strength: 0.010
        empirical_pairwise_strength: 0.015
        pairwise_epistasis_rank: 3
        epistasis_covariation_bias: 0.4

stale_cache_controls:
  enabled: true
  use_policy: comparison_only_not_parameter_source
  sources:
    - RUN-024
    - RUN-026
    - RUN-071

outputs:
  output_dir_name: proteingym-current-model-abc-refit-residual-ruggedness
  expected_files:
    - summary.json
    - synthetic_truth_recovery.csv
    - empirical_refit_summary.json
    - assay_refit_metrics.csv
    - selected_panel.csv
    - mavenn_assay_metrics.csv
    - target_features.csv
    - posterior_particles.csv
    - posterior_rounds.csv
    - posterior_parameter_summary.csv
    - branch_validations.csv
    - progress.json
    - progress.log
    - current_model_preflight.json

quick:
  mavenn:
    max_variants_per_assay: 1200
    epochs: 3
    early_stopping_patience: 1
    batch_size: 128
  abc:
    backend:
      kind: serial
      max_workers: 1
      batch_size: 1
    bootstrap_replicates: 8
    replicates_per_particle: 1
    smc:
      n_particles: 4
      n_rounds: 1
      initial_pool_multiplier: 2
      proposal_pool_multiplier: 2
      epsilon_quantile: 0.7
      seed: 111
  synthetic_truth_recovery:
    enabled: false
