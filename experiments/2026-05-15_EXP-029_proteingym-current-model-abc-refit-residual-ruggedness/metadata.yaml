id: EXP-029
type: experiment
title: ProteinGym empirical refit with current residual-ruggedness model
slug: proteingym-current-model-abc-refit-residual-ruggedness
status: planned
created: '2026-05-15T22:42:09+10:00'
owner: matthew-spence
scientific_context:
  aims:
  - AIM-001
  hypotheses:
  - HYP-001
  previous_experiments:
  - EXP-005
  - EXP-006
  - EXP-007
  - EXP-008
  - EXP-010
  - EXP-012
  - EXP-025
