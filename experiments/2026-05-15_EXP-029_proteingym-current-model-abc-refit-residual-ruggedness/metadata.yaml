question: Do current-model ABC refits of the relevant ProteinGym assays remove the
  stale-cache confound exposed by RUN-071 and yield empirical graphlet and spectral
  targets that can be fairly compared to the new residual-ruggedness model?
pre_experiment_prediction: If RUN-071's mismatch is partly a stale empirical-target
  artifact, then refitting PHOT, SPTN1, KRAS and matched stability/activity controls
  under the current smooth-core plus fixed-scale residual model should change empirical
  latent targets and graphlet spectra enough that model-vs-empirical distances improve
  relative to RES-028 while retaining held-out predictive checks. If mismatch persists
  after refit, it is evidence against the current model rather than against old cached
  preprocessing.
rationale: RES-028 deliberately used cached prepared ProteinGym outputs from older
  calibration and latent-trait definitions, which makes it a valid falsification of
  comparisons to those cached targets but not a definitive test of the current model
  after the residual-scale and epistasis semantics were revised. This experiment rebuilds
  the empirical targets and ABC posteriors under the current model before using any
  parameterized empirical information.
environment:
  stack:
    id: STACK-000
    version: '2026.05'
  overlay:
    enabled: true
    type: pip
    spec: environment/requirements.in
    lock: environment/requirements.lock.txt
