question: Does the simpler stability-targeted PHOT control still beat activity-oriented
  and two-trait formulations when fitted under the same held-out validation objective
  used in EXP-012?
pre_experiment_prediction: If the RES-011 improvement mainly reflects a better causal
  latent mapping rather than objective mismatch, then the stability-readout control
  should retain strong single- and double-mutant ranking under validation-objective
  SMC while exposing whether epistasis prediction and reference-to-peak geometry remain
  unresolved.
rationale: RES-011 showed that stability-targeted semantics improved PHOT_CHLRE ranking
  and KS, but it used the older bootstrap summary-vector SMC objective. RES-010 used
  the held-out validation objective for the explicit two-trait model. This experiment
  removes that objective mismatch by fitting the stability-targeted control with the
  same validation-objective machinery.
