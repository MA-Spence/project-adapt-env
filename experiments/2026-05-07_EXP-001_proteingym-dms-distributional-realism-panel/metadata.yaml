scientific_context:
  aims:
  - AIM-001
  hypotheses:
  - HYP-001
  previous_experiments: []
  motivating_results: []
question: Can Adapt-Env recover local distributional statistics from real ProteinGym
  DMS assays when alignments are built from assay wild-type sequences using the MMseqs
  API?
pre_experiment_prediction: A shared synthetic parameter regime should match empirical
  DFE and mutational-effect summary statistics across a panel of ProteinGym substitution
  assays better than naive synthetic controls, but with assay-to-assay residual mismatch.
rationale: HYP-001 should be tested first against external DMS assays because benchmark
  usefulness depends on reproducing real sample statistics before any stronger claim
  about exact landscape structure is attempted.
