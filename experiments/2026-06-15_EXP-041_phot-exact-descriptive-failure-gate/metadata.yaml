  - EXP-030
  - EXP-036
  - EXP-038
  motivating_results:
  - RES-013
  - RES-030
  - RES-036
  - RES-038
question: Before running any new ABC search, which exact dense PHOT graphlet summaries
  does the existing RUN-039 full ABC fit fail relative to the empirical latent_phi
  landscape?
pre_experiment_prediction: The RUN-039 full ABC fit will retain useful low-order predictive
  structure but will fail exact dense-subspace topology or spectral/local-energy summaries
  that were not part of the original validation objective.
rationale: The current ABC workflow is expensive and can obscure model misspecification
  by optimizing a broad summary vector. This experiment first computes deterministic
  complete-graphlet summaries on PHOT and emits a ranked failure ledger; a later ABC
  objective is justified only for summaries shown to fail descriptively.
