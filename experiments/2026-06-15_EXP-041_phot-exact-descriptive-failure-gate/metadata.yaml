id: EXP-041
type: experiment
title: PHOT exact descriptive failure gate for full ABC fit
slug: phot-exact-descriptive-failure-gate
status: completed
created: '2026-06-15T23:14:20+10:00'
owner: matthew-spence
scientific_context:
  aims:
