  - EXP-031
  motivating_results:
  - RES-030
  - RES-031
question: With PHOT as the only empirical test system, does a frozen fitted smooth/additive
  PHOT landscape combined with a correlated offset auxiliary landscape by f(x)=min(a(x),b(x))
  improve assay fit and held-out graphlet local ruggedness relative to the single-landscape
  base and fitted-current controls?
pre_experiment_prediction: If weakest-link coupling is the missing local nonlinear
  operator, some correlated hard-min grid points should improve PHOT assay fit statistics
  and held-out graphlet WHT/GFT/topology while producing empirical-like localized
  edge/plaquette innovation energy around switching boundaries. If improvements are
  only diffuse, only graphlet-specific, or worsen assay fit, this implementation does
  not support HYP-008.
rationale: 'RES-031 showed that additive/gated no-module coupling could move PHOT
  graphlet distance but did not create validated localized ruggedness. The user-proposed
  hard-min operator is biologically different: two related essential functions are
  constrained by the weaker trait, so local topology may arise at trait-switch boundaries
  rather than from additive innovation modules. This experiment freezes the RES-030
  PHOT fit and performs a deterministic grid search before any new ABC.'
