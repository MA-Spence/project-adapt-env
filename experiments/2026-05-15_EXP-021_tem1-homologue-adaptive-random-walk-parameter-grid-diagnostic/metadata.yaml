  previous_experiments:
  - EXP-020
  motivating_results:
  - RES-020
question: Do TEM-1-conditioned stability-margin landscapes reproduce literature-supported
  adaptive-walk and random-walk behaviour when starts are real TEM-1 homologues ranked
  by consensus distance, and do stability-margin and epistasis-strength knobs move
  those behaviours directionally over realistic parameter ranges?
pre_experiment_prediction: If the EXP-020 failure was caused by peak-fraction stratification
  and parameter-specific stability-threshold behaviour rather than a generic inability
  to produce biological walk dynamics, then TEM-1 homologue starts farther from the
  alignment consensus should show lower stability margins, more beneficial opportunities,
  larger adaptive gains, less random-walk autocorrelation, and stronger deleterious/negative
  epistatic constraints; increasing stability margin should increase neutrality, while
  increasing epistasis strength should increase pairwise epistasis and ruggedness
  diagnostics.
rationale: EXP-020 mixed adaptive-walk support with failed peak-proximal epistasis
  tests. Literature on TEM-1 and stability-threshold proteins suggests the relevant
  axis for this model is robustness or consensus/stability distance, not stored peak
  fraction. This experiment repeats the EXP-020 walk/neighbourhood design using a
  real TEM-1 reference, homologues from the MMSeqs alignment used for conditioning,
  random walks for ruggedness/autocorrelation diagnostics, and a realistic stability-margin
  and epistasis-strength parameter grid to diagnose HYP-004 and HYP-005 together.
