id: EXP-021
type: experiment
title: TEM-1 homologue adaptive and random walk parameter-grid diagnostic
slug: tem1-homologue-adaptive-random-walk-parameter-grid-diagnostic
status: planned
created: '2026-05-15T08:17:07+10:00'
owner: matthew-spence
scientific_context:
  aims:
