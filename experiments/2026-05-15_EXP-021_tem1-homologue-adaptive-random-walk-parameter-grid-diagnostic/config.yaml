experiment_id: EXP-021
title: TEM-1 homologue adaptive and random walk parameter-grid diagnostic
stack: STACK-000
target: lab-slurm
experiment:
  id: EXP-021

reference:
  protein: TEM-1 beta-lactamase
  uniprot_id: P62593
  source: UniProt reviewed BLAT_ECOLX sequence
  sequence: MSIQHFRVALIPFFAAFCLPVFAHPETLVKVKDAEDQLGARVGYIELDLNSGKILESFRPEERFPMMSTFKVLLCGAVLSRVDAGQEQLGRRIHYSQNDLVEYSPVTEKHLTDGMTVRELCSAAITMSDNTAANLLLTTIGGPKELTAFLHNMGDHVTRLDRWEPELNEAIPNDERDTTMPAAMATTLRKLLTGELLTLASRQQLIDWMEADKVAGPLLRSALPAGWFIADKSGAGERGSRGIIAALGPDGKPSRIVVIYTTGSQATMDERNRQIAEIGASLIKHW

alignment:
  source: MMSeqs ColabFold MSA API
  max_sequences: 768
  mmseqs_cache_dir: .labproj/cache/mmseqs
  poll_interval_seconds: 5
  timeout_seconds: 20
  max_retries: 6

adapt_env:
  base_config:
    observed_fitness_combine_mode: stability_margin
    stability_scale: 1.0
    stability_conservation_power: 1.0
    threshold_steepness: 20.0
    fitness_output_scale: 10.0
    n_epistatic_terms: 320
    generic_epistasis_target: stability
    empirical_pairwise_strength: null
    epistasis_covariation_bias: 0.0
    pairwise_epistasis_rank: 2
    n_higher_order_epistatic_terms: 0
    noise_amplitude: 0.0
    noise_heterogeneity: 0.0
    peak_search_steps: 40
    peak_search_top_single_starts: 2
    peak_search_random_starts: 2
    peak_search_random_radius: 1
    peak_distance_from_consensus: 0
    use_blosum_kernel: true
    blosum_blend: 0.5

parameter_grid:
  stability_margin: [4.0, 8.0, 12.0]
  epistasis_strength: [0.0, 0.025, 0.05]

sampling:
  seeds: [9101, 9102]
  start_strata:
    - name: near_consensus
      quantile_min: 0.00
      quantile_max: 0.20
    - name: intermediate_consensus
      quantile_min: 0.35
      quantile_max: 0.65
    - name: far_consensus
      quantile_min: 0.80
      quantile_max: 1.00
  starts_per_stratum: 3
  adaptive_walk_modes: [greedy_adaptive, random_beneficial_adaptive]
  max_adaptive_walk_steps: 24
  random_walk_steps: 80
  epistasis_pairs_per_background: 96
  batch_size: 4096
  neutral_threshold_abs: 0.02
  neutral_threshold_fraction_of_parent: 0.02
  beneficial_threshold_abs: 0.02
  beneficial_threshold_fraction_of_parent: 0.02
  min_epistasis_effect_threshold: 0.02

validation_thresholds:
  min_abs_spearman: 0.20
  min_random_walk_autocorrelation_spearman: 0.10
  max_median_deceleration_ratio: 0.75

quick:
  alignment:
    max_sequences: 96
    synthetic_smoke_sequences: true
    synthetic_smoke_seed: 1901
  parameter_grid:
    stability_margin: [4.0, 12.0]
    epistasis_strength: [0.0, 0.05]
  sampling:
    seeds: [9101]
    start_strata:
      - name: near_consensus
        quantile_min: 0.00
        quantile_max: 0.25
      - name: far_consensus
        quantile_min: 0.75
        quantile_max: 1.00
    starts_per_stratum: 1
    max_adaptive_walk_steps: 4
    random_walk_steps: 12
    epistasis_pairs_per_background: 16
    batch_size: 2048
  adapt_env:
    base_config:
      peak_search_steps: 4
      peak_search_top_single_starts: 1
      peak_search_random_starts: 1
      peak_search_random_radius: 1
