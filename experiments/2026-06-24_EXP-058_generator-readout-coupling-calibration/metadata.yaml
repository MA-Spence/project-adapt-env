question: Can the public additive thermodynamic core plus GNK generator be calibrated
  so the observable simultaneously preserves core neutral-network/diminishing-return
  guardrails and transmits GNK-specific epistasis through the readout?
pre_experiment_prediction: A desaturated and re-centred single-gate readout may expose
  a feasible region; if it cannot satisfy core guardrails and GNK separation together,
  mixed post-readout score routing or a two-channel product observable will be required.
rationale: This is the single preregistered generator calibration experiment specified
  by scratch/RES-056_assessment_readout_coupling_and_next_steps.md. It tests fixes
  A, B, and C for the readout-coupling defect isolated by RES-055, while keeping the
  unrelated EXP-050 measurement-operator tooling failure from RES-056 off the Component
  1 critical path.
